<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3B2BB8">
<meta name="robots" content="noindex,nofollow">
<title>Ruang Belajar</title>
<meta property="og:title" content="Ruang Belajar">
<meta property="og:description" content="Materi pertemuan, LKPD, latihan soal dan kisi-kisi ujian dari guru.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--c1:#3B2BB8;--c2:#7B5CFF;--c3:#FFB703;--ink:#14122B;--mute:#5D5A78;--bg:#F4F2FF;--card:#fff;--line:#E6E2FA}
body{background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
.w{max-width:760px;margin:0 auto;padding:0 14px 60px}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:34px 22px 30px;border-radius:0 0 34px 34px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 20px 40px -24px rgba(30,20,90,.8)}
.hero .in{max-width:760px;margin:0 auto;position:relative;z-index:2}
.bl{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;animation:melayang 9s ease-in-out infinite}
.bl.a{width:220px;height:220px;right:-60px;top:-70px;background:var(--c3)}.bl.b{width:160px;height:160px;left:-50px;bottom:-60px;background:#fff;animation-delay:-3s;opacity:.18}.bl.c{width:90px;height:90px;right:30%;bottom:-30px;background:#4CC9F0;animation-delay:-5s}
.sh{position:absolute;z-index:1;opacity:.5;animation:putar 14s linear infinite}
@keyframes melayang{50%{transform:translate(14px,-18px) scale(1.08)}}@keyframes putar{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:800;letter-spacing:.4px;animation:muncul .6s both}
.hero h1{font-size:28px;font-weight:800;line-height:1.2;margin-top:14px;animation:muncul .6s .1s both}
.hero p{font-size:14px;opacity:.92;margin-top:8px;line-height:1.5;animation:muncul .6s .2s both}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;animation:muncul .6s .3s both}.chips span{background:rgba(255,255,255,.16);border-radius:12px;padding:7px 11px;font-size:12.5px;font-weight:700}
@keyframes muncul{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* navigasi bagian */
.nav{position:sticky;top:0;z-index:20;background:rgba(244,242,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 0 8px;margin:0 -14px;border-bottom:1px solid var(--line)}
.nav .sc{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}.nav .sc::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--mute);font-size:13px;font-weight:800;padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);transition:.2s}
.nav a.on{background:var(--c1);border-color:var(--c1);color:#fff}
.prog{height:4px;background:var(--line);border-radius:4px;margin:8px 14px 0;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c2));transition:width .2s}
/* kartu */
.sec{margin-top:22px;scroll-margin-top:70px}
.st{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--c1);margin:0 2px 10px}
.st i{width:34px;height:34px;border-radius:11px;background:var(--c1);color:#fff;display:grid;place-items:center;font-style:normal;font-size:17px;box-shadow:0 8px 16px -8px var(--c1)}
.cd{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 14px 34px -24px rgba(30,20,90,.55);border:1px solid var(--line)}
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.9,.3,1.2)}.rv.on{opacity:1;transform:none}
.tj{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.55}.tj:first-child{border-top:0;padding-top:0}
.tj b{flex:none;width:28px;height:28px;border-radius:50%;background:#FFF3D6;color:#B76E00;display:grid;place-items:center;font-size:14px}
.mt{margin-top:14px;position:relative;padding-left:58px}.mt:first-of-type{margin-top:0}
.mt .no{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 10px 20px -10px var(--c1)}
.mt h3{font-size:18px;line-height:1.3;padding-top:9px}
.tx{font-size:15.5px;line-height:1.75;color:#2A2745;margin-top:8px;word-break:break-word}.tx p{margin-top:8px}.tx p:first-child{margin-top:0}.tx ul{margin:8px 0 0 20px}.tx li{margin-top:4px}.tx b{color:var(--ink)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:zoom-in;transition:transform .2s}.gal figure:active{transform:scale(.97)}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#EEE}.gal figcaption{font-size:12.5px;padding:8px 10px;color:var(--mute);font-weight:600}
.vid{margin-top:12px;border-radius:18px;overflow:hidden;background:#000;position:relative;padding-top:56.25%}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vk{font-size:13px;color:var(--mute);margin-top:6px;font-weight:600}
.lk{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px}
.lk span{width:38px;height:38px;border-radius:12px;background:#E8F7FF;color:#0277BD;display:grid;place-items:center;flex:none;font-size:18px}
.tg{background:linear-gradient(135deg,#FFF7E0,#FFEFC2);border:1.5px solid #F7D27A}
.tgs{margin-top:12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:12px 14px}
.tgs label{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;font-weight:600;cursor:pointer}.tgs input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#2B9348}
textarea,input,select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:13px;font-size:15px;outline:none;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.5;margin-top:10px}textarea:focus,input:focus,select:focus{border-color:var(--c2);box-shadow:0 0 0 3px rgba(123,92,255,.18)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 12px 24px -14px var(--c1);transition:transform .12s;text-decoration:none}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55}.btn.gh{background:#EEEBFF;color:var(--c1);box-shadow:none}.btn.gr{background:linear-gradient(135deg,#2B9348,#55A630)}.btn.or{background:linear-gradient(135deg,#F48C06,#FFB703);color:#2B1A00}
.rk{background:linear-gradient(135deg,#E8FFF1,#D3F9E2);border:1.5px solid #8CE0AE}
/* kuis */
.qz-h{display:flex;align-items:center;gap:10px}.qz-h b{flex:1;font-size:14px;color:var(--mute)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.dots i{width:22px;height:8px;border-radius:5px;background:var(--line);transition:.3s}.dots i.on{background:var(--c2)}.dots i.ok{background:#2B9348}.dots i.no{background:#E5383B}
.qq{font-size:17px;line-height:1.6;font-weight:700;margin-top:14px;white-space:pre-wrap;word-break:break-word}
.qi{display:block;max-width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--line)}
.op{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:10px;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:15.5px;line-height:1.5;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.op:active{transform:scale(.98)}.op i{font-style:normal;flex:none;width:32px;height:32px;border-radius:50%;border:2px solid #CFC8F5;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--mute)}
.op span{flex:1;padding-top:4px;white-space:pre-wrap;word-break:break-word}
.op.on{border-color:var(--c2);background:#F3EFFF}.op.on i{background:var(--c2);border-color:var(--c2);color:#fff}
.op.ok{border-color:#2B9348;background:#EAFBEF}.op.ok i{background:#2B9348;border-color:#2B9348;color:#fff}
.op.no{border-color:#E5383B;background:#FFEFEF;animation:goyang .4s}.op.no i{background:#E5383B;border-color:#E5383B;color:#fff}
@keyframes goyang{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.55;animation:muncul .35s both}.fb.ok{background:#EAFBEF;color:#1B6B34}.fb.no{background:#FFEFEF;color:#9B1C1F}.fb.in{background:#F3EFFF;color:#3B2BB8}
.row{display:flex;gap:10px}.row .btn{margin-top:14px}
.skor{text-align:center;padding:10px 0}.ring{width:170px;height:170px;margin:0 auto;position:relative}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--c1)}
.star{font-size:30px;letter-spacing:6px;margin-top:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.g3 div{background:#F4F2FF;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--mute)}.g3 b{display:block;font-size:22px;color:var(--ink)}
/* latihan */
.kk{display:grid;gap:10px}.kki{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:#FAF9FF;border:1px solid var(--line)}
.kki .n{flex:none;width:34px;height:34px;border-radius:11px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800}
.kki b{display:block;font-size:14.5px;line-height:1.45}.kki .m{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.45}
.kki .t{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.kki .t span{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;background:#EEEBFF;color:var(--c1)}.kki .t span.l{background:#FFF3D6;color:#B76E00}.kki .t span.b{background:#E3F6FF;color:#0277BD}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pkc{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;box-shadow:0 18px 30px -20px rgba(30,20,90,.8);animation:muncul .5s both}
.pkc:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.pkc h3{font-size:22px;font-weight:800}.pkc p{font-size:13px;opacity:.92;margin-top:4px}.pkc .bs{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800}
.pkc .row .btn{background:#fff;color:#2B1A6B;box-shadow:none;font-size:13.5px;padding:12px 8px}.pkc .row .btn.s{background:rgba(255,255,255,.18);color:#fff}
/* runner layar penuh */
#run{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#run.show{display:flex}
.rb{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.rb .t{flex:1;min-width:0}.rb .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rb .t span{font-size:11.5px;opacity:.85}
.rb button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:11px;padding:8px 11px;font-weight:800;font-size:13px;cursor:pointer}
.tm{background:var(--c3);color:#2B1A00;font-weight:800;font-size:16px;border-radius:12px;padding:7px 11px;font-variant-numeric:tabular-nums}.tm.low{background:#E5383B;color:#fff;animation:kd 1s infinite}@keyframes kd{50%{opacity:.6}}
.rw{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.rw .in{max-width:720px;margin:0 auto;padding:14px 14px 110px}
.rn{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:41}
.rn button{flex:1;border:0;border-radius:14px;padding:14px 6px;font-size:14px;font-weight:800;cursor:pointer;background:#EEEBFF;color:var(--c1)}.rn .p{background:var(--c1);color:#fff;flex:1.3}.rn .g{background:#2B9348;color:#fff;flex:1.3}
.rv-l{margin-top:12px}.rv-i{padding:12px 0;border-top:1px dashed var(--line)}.rv-i:first-child{border-top:0}
.rv-i .h{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800}.rv-i .q{font-size:14.5px;margin-top:6px;white-space:pre-wrap;line-height:1.5}.rv-i .a{font-size:13.5px;margin-top:6px;line-height:1.5}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,18,43,.7);z-index:60;display:none;place-items:center;padding:18px}.ov.show{display:grid}
.ov>div{background:#fff;border-radius:24px;padding:22px;max-width:440px;width:100%;max-height:88vh;overflow:auto;animation:muncul .3s both}
.ov h3{font-size:19px}.ov p{font-size:14px;color:var(--mute);margin-top:6px;line-height:1.5}.ov label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:none;place-items:center;padding:14px;cursor:zoom-out}.lb.show{display:grid}.lb img{max-width:100%;max-height:86vh;border-radius:12px}.lb p{color:#fff;text-align:center;margin-top:10px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:12px}.grid button{height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--mute);cursor:pointer}.grid button.isi{background:var(--c2);border-color:var(--c2);color:#fff}.grid button.ini{box-shadow:0 0 0 3px var(--c3)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:80;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
.kf{position:fixed;top:-20px;z-index:90;pointer-events:none;width:10px;height:14px;border-radius:2px;animation:jatuh linear forwards}@keyframes jatuh{to{transform:translateY(110vh) rotate(720deg)}}
.ft{text-align:center;font-size:12px;color:var(--mute);margin-top:30px}
.ld{max-width:760px;margin:40px auto;padding:0 14px}.ld .cd{text-align:center;font-size:14px;color:var(--mute)}
.em{font-size:13.5px;color:var(--mute);text-align:center;padding:6px 0}
/* ===== sambutan & petunjuk ===== */
.it{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.18),transparent 40%),linear-gradient(150deg,var(--c1),var(--c2) 70%,#FF8FB1);color:#fff;transition:opacity .6s,transform .6s}
.it.keluar{opacity:0;transform:scale(1.15)}
.it-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.it-bg i{position:absolute;bottom:-60px;font-style:normal;opacity:.55;animation:naik linear infinite}
@keyframes naik{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(360deg)}}
.it-c{position:relative;max-width:480px;margin:0 auto;min-height:100%;padding:28px 22px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.it-mas{position:relative;width:190px;animation:masuk .8s cubic-bezier(.2,1.5,.4,1) both}.it-mas.kecil{width:110px}
@keyframes masuk{from{opacity:0;transform:translateY(40px) scale(.6)}}
.mas{width:100%;display:block;overflow:visible}.mas-bd{animation:lompat 1.6s ease-in-out infinite}.mas-sh{transform-origin:100px 188px;animation:bayang 1.6s ease-in-out infinite}
@keyframes lompat{50%{transform:translateY(-10px)}}@keyframes bayang{50%{transform:scaleX(.8);opacity:.6}}
.mas-tg{transform-origin:150px 102px;animation:lambai 1s ease-in-out infinite}@keyframes lambai{50%{transform:rotate(-24deg)}}
.mata{transform-box:fill-box;transform-origin:center;animation:kedip 4s infinite}@keyframes kedip{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.it-bub{position:absolute;right:-70px;top:4px;background:#fff;color:var(--ink);font-weight:800;font-size:14px;padding:9px 13px;border-radius:16px 16px 16px 4px;box-shadow:0 10px 24px -10px rgba(0,0,0,.45);white-space:nowrap;animation:pop .6s .6s cubic-bezier(.2,1.6,.4,1) both}
.it-mas.kecil .it-bub{right:-120px;font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.it-p{margin-top:18px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;animation:muncul .6s .3s both}
.it-h{font-size:30px;line-height:1.2;font-weight:800;margin-top:14px;min-height:72px}.it-cr{display:inline-block;width:3px;height:1em;background:#FFD43B;margin-left:3px;vertical-align:-3px;animation:kd .8s infinite}
.it-s{font-size:17px;font-weight:700;opacity:0;margin-top:4px;transition:opacity .6s,transform .6s;transform:translateY(10px)}.it-s.on{opacity:.95;transform:none}
.it-g{font-size:13.5px;opacity:.85;margin-top:4px}
.it .btn.it-b{background:#fff;color:var(--c1);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);font-size:16.5px;max-width:340px;margin-top:22px;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}.it .btn.it-b.on{opacity:1;transform:none;animation:denyut 1.8s 1s infinite}
@keyframes denyut{50%{box-shadow:0 0 0 10px rgba(255,255,255,.18),0 14px 30px -12px rgba(0,0,0,.5)}}
.it-sk{margin-top:14px;background:none;border:0;color:#fff;opacity:.75;font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline}
.it-h2{font-size:24px;font-weight:800;margin-top:12px;animation:muncul .5s both}
.it-l{position:relative;width:100%;margin-top:14px;text-align:left}
.it-i{position:relative;z-index:1;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.96);color:var(--ink);border-radius:18px;padding:12px 14px;margin-top:10px;box-shadow:0 12px 24px -16px rgba(0,0,0,.6);opacity:0;animation:geserMasuk .55s var(--d) cubic-bezier(.2,1.4,.4,1) both}
@keyframes geserMasuk{from{opacity:0;transform:translateX(-40px) scale(.9)}to{opacity:1;transform:none}}
.it-n{position:absolute;left:-9px;top:-9px;width:24px;height:24px;border-radius:50%;background:#FFD43B;color:#2B1A00;font-size:12.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.it-e{font-size:28px;flex:none;width:46px;height:46px;border-radius:14px;background:#F3EFFF;display:grid;place-items:center;animation:goyangE 2.4s calc(var(--d) + .6s) ease-in-out infinite}
@keyframes goyangE{0%,80%,100%{transform:none}86%{transform:rotate(-12deg) scale(1.1)}93%{transform:rotate(10deg) scale(1.1)}}
.it-i b{display:block;font-size:15px}.it-i small{display:block;font-size:12.5px;color:var(--mute);line-height:1.45;margin-top:2px}
.it-garis{position:absolute;left:37px;top:20px;bottom:20px;width:3px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.8) 0 6px,transparent 6px 12px);z-index:0;transform-origin:top;animation:tumbuh .8s var(--d) both}
@keyframes tumbuh{from{transform:scaleY(0)}}
#it2{animation:muncul .5s var(--d) both!important;opacity:1;transform:none}
.it-kd{width:100%;background:rgba(255,255,255,.97);color:var(--ink);border-radius:24px;padding:20px;margin-top:16px;text-align:left;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);animation:masuk .6s .2s cubic-bezier(.2,1.4,.4,1) both}
