<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1E4A">
<title>Formulir Pemesanan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif}
body{background:#EEF2F9;color:#0F1B33;min-height:100vh;padding:24px 16px}
.w{max-width:480px;margin:0 auto}
.hd{background:linear-gradient(135deg,#0B1E4A,#1E3A8A 55%,#2F5DA8);color:#fff;border-radius:24px;padding:24px 22px;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(10,20,45,.6)}
.hd:after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.ic{width:52px;height:52px;border-radius:16px;background:#E5B53F;color:#1A1300;display:grid;place-items:center;margin-bottom:14px}
h1{font-size:23px;font-weight:800}.hd p{font-size:13.5px;opacity:.9;margin-top:6px;line-height:1.5}
.cd{background:#fff;border-radius:22px;padding:22px;margin-top:14px;box-shadow:0 10px 30px -18px rgba(10,20,45,.4)}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}label:first-child{margin-top:0}label i{color:#E03131;font-style:normal}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid #D9E2F1;border-radius:13px;font-size:15px;background:#fff;outline:none;color:#0F1B33}
input:focus,select:focus,textarea:focus{border-color:#1E3A8A;box-shadow:0 0 0 3px rgba(30,58,138,.15)}
textarea{min-height:90px;resize:vertical}.hint{font-size:12px;color:#55617A;margin-top:5px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:#1E3A8A;color:#fff;font-size:15.5px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}
.er{background:#FFF0F0;color:#C92A2A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:14px;display:none}
.ok{text-align:center;padding:10px 0}.ok .ic{margin:0 auto 14px;background:#EBFBEE;color:#2B8A3E;width:72px;height:72px;border-radius:50%}
.ok h2{font-size:20px}.ok p{color:#55617A;font-size:14px;margin-top:8px;line-height:1.5}
.wa{display:block;margin-top:18px;padding:14px;border-radius:14px;background:#1FAF54;color:#fff;font-weight:800;text-decoration:none}
.ft{text-align:center;font-size:11.5px;color:#55617A;margin-top:16px}.hp{position:absolute;left:-9999px}
.ld{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF2F9,#E2E8F3,#EEF2F9);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="w">
  <div class="hd">
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></div>
    <h1 id="jd">Formulir Pemesanan</h1><p id="ds">Memuat formulir…</p>
  </div>
  <div class="cd" id="cd"><div class="ld"></div><div class="ld" style="width:70%"></div><div class="ld" style="width:85%"></div></div>
  <div class="ft">Dikelola melalui RUANGKU</div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search),s=(q.get("s")||"").trim();
  var API=/^https:\/\//.test(s)?s.split("?")[0]:"https://script.google.com/macros/s/"+s+"/exec";
  var cd=document.getElementById("cd");
  function e(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function gagal(m){cd.innerHTML='<div class="ok"><h2>Formulir belum bisa dibuka</h2><p>'+e(m)+'</p></div>';document.getElementById("ds").textContent=""}
  if(!s){gagal("Link formulir tidak lengkap. Minta link terbaru kepada pemilik jasa.");return}
  fetch(API+"?aksi=jasaInfo").then(function(r){return r.json()}).then(function(r){
    if(!r.ok||!r.config)throw 0;var c=r.config;
    document.title=c.nama;document.getElementById("jd").textContent=c.nama;document.getElementById("ds").textContent=c.deskripsi||"";
    if(!c.buka){cd.innerHTML='<div class="ok"><h2>Pemesanan sedang ditutup</h2><p>Silakan hubungi kami kembali nanti.</p></div>';return}
    cd.innerHTML='<form id="f" autocomplete="on"><label>Nama Lengkap <i>*</i></label><input name="nama" required maxlength="80" placeholder="Nama Anda">'+
      '<label>Nomor HP / WhatsApp <i>*</i></label><input name="hp" type="tel" inputmode="tel" required maxlength="16" placeholder="08xxxxxxxxxx">'+
      '<label>Jenis Tugas <i>*</i></label><select name="jenis" required><option value="">Pilih jenis tugas</option>'+c.jenis.map(function(j){return"<option>"+e(j)+"</option>"}).join("")+'</select>'+
      '<label>Tenggat Waktu <i>*</i></label><input name="tenggat" type="date" required><div class="hint">Tanggal tugas harus selesai</div>'+
      '<label>Detail Tugas (opsional)</label><textarea name="detail" maxlength="1000" placeholder="Judul, jumlah halaman, ketentuan khusus, dll."></textarea>'+
      '<input class="hp" name="situs" tabindex="-1" autocomplete="off"><div class="er" id="er"></div><button id="b">Kirim Pesanan</button></form>';
    var f=document.getElementById("f"),t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());f.tenggat.min=t.toISOString().slice(0,10);
    f.onsubmit=function(ev){ev.preventDefault();var b=document.getElementById("b"),er=document.getElementById("er");er.style.display="none";b.disabled=true;b.textContent="Mengirim…";
      var d={aksi:"pesan",nama:f.nama.value,hp:f.hp.value,jenis:f.jenis.value,tenggat:f.tenggat.value,detail:f.detail.value,situs:f.situs.value};
      fetch(API,{method:"POST",body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(r){
        if(!r||!r.ok){er.textContent=(r&&r.pesan)||"Gagal mengirim";er.style.display="block";b.disabled=false;b.textContent="Kirim Pesanan";return}
        var wa=r.wa?String(r.wa).replace(/\D/g,"").replace(/^0/,"62"):"";
        cd.innerHTML='<div class="ok"><div class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div><h2>Pesanan Terkirim</h2><p>Terima kasih, '+e(d.nama)+'. Pesanan '+e(d.jenis)+' sudah kami terima dan akan segera dihubungi melalui WhatsApp.</p>'+
          (wa?'<a class="wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent("Halo, saya "+d.nama+" baru saja memesan "+d.jenis+" dengan tenggat "+d.tenggat+".")+'">Konfirmasi lewat WhatsApp</a>':'')+'</div>';
      }).catch(function(){er.textContent="Gagal mengirim. Periksa koneksi lalu coba lagi.";er.style.display="block";b.disabled=false;b.textContent="Kirim Pesanan"})};
  }).catch(function(){gagal("Tidak dapat terhubung ke server. Periksa koneksi internet lalu muat ulang halaman.")});
})();
</script>
</body>
</html>
