<style>
:root{
  --bg:#F5F7FC; --card:#FFFFFF; --soft:#EAF0FA; --line:#D9E2F1;
  --txt:#0F1B33; --mute:#55617A;
  --pri:#1E3A8A; --prid:#18306F; --pink:#2F5DA8; --yel:#E5B53F; --grn:#2B8A3E; --vio:#7048E8; --red:#E03131; --wa:#1FAF54;
  --H:#2B8A3E; --S:#7048E8; --I:#C25E00; --A:#E03131;
  --Ht:#EBFBEE; --St:#F3F0FF; --It:#FFF4E6; --At:#FFF0F0;
  --rad:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safe-b))}
.top{padding:calc(14px + var(--safe-t)) 18px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#0B1E4A,#1E3A8A 45%,#2F5DA8);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 10px 30px -12px rgba(30,58,138,.55)}
.logo{width:48px;height:48px;border-radius:14px;background:#fff;padding:3px;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:11px}
.top h1{font-size:17px;font-weight:800;line-height:1.15}
.top p{font-size:12px;opacity:.95;margin-top:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0}
.chip-kelas{background:#E5B53F;color:#0F1B33;font-weight:800;font-size:12px;padding:7px 11px;border-radius:999px;white-space:nowrap}
main{padding:14px 16px 0}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#0B1E4A 0%,#1E3A8A 35%,#2F5DA8 80%,#0A1838 100%);transition:opacity .55s ease,transform .7s cubic-bezier(.7,0,.3,1)}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:float 7s ease-in-out infinite}
#splash .b1{width:260px;height:260px;background:rgba(229,181,63,.45);top:-70px;right:-80px}
#splash .b2{width:200px;height:200px;background:rgba(255,255,255,.18);bottom:-60px;left:-60px;animation-delay:-2s}
#splash .b3{width:120px;height:120px;background:rgba(255,255,255,.14);top:22%;left:-30px;animation-delay:-4s}
#splash .b4{width:90px;height:90px;background:rgba(229,181,63,.35);bottom:18%;right:8%;animation-delay:-1s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14px,-18px) scale(1.07)}}
.sp-logo{position:relative;width:148px;height:148px;display:grid;place-items:center;margin-bottom:26px}
.sp-logo .badge{width:118px;height:118px;border-radius:34px;background:#fff;display:grid;place-items:center;box-shadow:0 18px 40px rgba(5,15,40,.35);
  animation:pop .9s cubic-bezier(.2,1.6,.4,1) both .15s;position:relative;z-index:2}
.sp-logo .badge img{width:100px;height:100px;object-fit:contain;border-radius:22px}
.sp-logo .ring{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(255,255,255,.75);animation:spin 9s linear infinite,fadeIn .6s .5s both}
.sp-logo .pulse{position:absolute;inset:14px;border-radius:40px;background:rgba(255,255,255,.35);animation:pulse 1.8s ease-out infinite .9s;opacity:0}
.sp-logo .spark{position:absolute;width:12px;height:12px;border-radius:50%;background:#E5B53F;box-shadow:0 0 12px #E5B53F;top:-2px;left:50%;margin-left:-6px;transform-origin:6px 76px;animation:spin 3.2s linear infinite,fadeIn .5s .9s both}
@keyframes pop{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sp-t1{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:.92;animation:fadeUp .6s .55s both}
.sp-t2{font-size:27px;font-weight:800;margin:6px 0 10px;letter-spacing:-.3px;animation:fadeUp .6s .7s both;text-align:center}
.sp-chip{background:#E5B53F;color:#0F1B33;font-weight:800;font-size:14px;padding:8px 18px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.2);animation:pop .7s cubic-bezier(.2,1.6,.4,1) .95s both}
.sp-tag{font-size:12.5px;font-weight:600;opacity:.9;margin:-4px 0 12px;text-align:center;padding:0 30px;letter-spacing:.2px;animation:fadeUp .6s .8s both}
.sp-hello{margin-top:22px;font-size:14px;font-weight:600;text-align:center;line-height:1.5;animation:fadeUp .6s 1.15s both;padding:0 30px}
.sp-hello b{font-weight:800}
.sp-bar{position:absolute;bottom:calc(64px + var(--safe-b));width:170px;height:6px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden;animation:fadeIn .4s .6s both}
.sp-bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#E5B53F,#fff);animation:load 1.7s cubic-bezier(.6,0,.2,1) .7s forwards}
@keyframes load{to{width:100%}}
.sp-foot{position:absolute;bottom:calc(30px + var(--safe-b));font-size:11.5px;font-weight:600;opacity:.85;animation:fadeIn .6s 1s both}
/* ---------- PAGE ANIMATION ---------- */
main.anim>*{animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both}
main.anim>*:nth-child(1){animation-delay:.02s}main.anim>*:nth-child(2){animation-delay:.07s}main.anim>*:nth-child(3){animation-delay:.12s}
main.anim>*:nth-child(4){animation-delay:.17s}main.anim>*:nth-child(5){animation-delay:.22s}main.anim>*:nth-child(6){animation-delay:.27s}
main.anim>*:nth-child(n+7){animation-delay:.32s}
main.anim .quick>*,main.anim .menu-grid>*{animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both}
main.anim .quick>*:nth-child(2),main.anim .menu-grid>*:nth-child(2){animation-delay:.05s}
main.anim .quick>*:nth-child(3),main.anim .menu-grid>*:nth-child(3){animation-delay:.1s}
main.anim .quick>*:nth-child(4),main.anim .menu-grid>*:nth-child(4){animation-delay:.15s}
main.anim .quick>*:nth-child(5),main.anim .menu-grid>*:nth-child(5){animation-delay:.2s}
main.anim .quick>*:nth-child(6),main.anim .menu-grid>*:nth-child(6){animation-delay:.25s}
main.anim .quick>*:nth-child(7),main.anim .menu-grid>*:nth-child(7){animation-delay:.3s}
main.anim .quick>*:nth-child(8),main.anim .menu-grid>*:nth-child(8){animation-delay:.35s}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.top{animation:slideDown .6s cubic-bezier(.2,.8,.3,1) both}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
nav.bn button{transition:background .25s,color .25s,transform .15s}
nav.bn button:active{transform:scale(.9)}
nav.bn button.on svg{animation:bounce .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bounce{0%{transform:scale(.6)}100%{transform:scale(1)}}
.qa:active,.mcard:active,.stu:active{transform:scale(.97)}
.qa,.mcard,.stu{transition:transform .12s}
.seg button{transition:background .2s,color .2s,transform .12s}
.seg button.on{animation:bounce .35s cubic-bezier(.2,1.6,.4,1)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

function b64OfBlob(blob){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(blob)})}

  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(msg||"File diunduh")}

async function shareBlob(name,blob,text,pkg,phone){
  if(BR&&phone&&BR.shareFileTo){try{BR.shareFileTo(name,await b64OfBlob(blob),blob.type,text||"",pkg||"",phone);return true}catch(e){}}
  if(BR){try{BR.shareFile(name,await b64OfBlob(blob),blob.type,text||"",pkg||"");return true}catch(e){}}
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share(text?{files:[f],text}:{files:[f]});return true}catch(e){if(e&&e.name==="AbortError")return true}}
  return false}

function weekKeys(){const d=new Date(),dw=(d.getDay()+6)%7,out=[];for(let i=0;i<7;i++){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dw+i);out.push(dkey(x))}return out}
function progJasa(){const lim=dkey(new Date(Date.now()-30*864e5)),I=S.jasa.items.filter(x=>x.status!=="Batal"&&(x.status!=="Selesai"||(x.selesai||(x.waktu||"").slice(0,10))>=lim));
  const sel=I.filter(x=>x.status==="Selesai").length,akt=jsAktif(),dekat=akt.filter(x=>x.tenggat&&jsSisa(x)<=2).length;
  const sk=S.jasa.skripsi.filter(x=>x.status==="Aktif");
  return{p:I.length?sel/I.length:0,big:akt.length+sk.length,sub:(akt.length?akt.length+" pesanan":"")+(akt.length&&sk.length?" · ":"")+(sk.length?sk.length+" skripsi":"")||"Tidak ada pekerjaan aktif",warn:dekat?dekat+" tenggat dekat":"",lbl:"aktif"}}
function progSekolah(){const k=today(),tot=S.students.length,c=tot?countDay(k):null,absOk=tot&&c&&c.X===0;
  let n=0,d=0;weekKeys().forEach(kk=>S.agendaPri.forEach(x=>{if(x.jenis==="Pribadi"||!agOn(x,kk))return;n++;if(agDone(x,kk))d++}));
  const isWork=(new Date().getDay()%7)!==0;const tN=n+(tot&&isWork?1:0),tD=d+(absOk&&isWork?1:0);
  return{p:tN?tD/tN:1,big:tD+"/"+tN,sub:tot&&isWork?(absOk?"Absensi lengkap ✓":"Absensi belum lengkap"):"Agenda minggu ini",lbl:"selesai"}}
function skProg(x){const T=x.tahap||[];if(!T.length)return 0;return T.reduce((a,t)=>a+[0,.5,.75,1][t.s||0],0)/T.length}
function progSkripsi(){const L=S.jasa.skripsi.filter(x=>x.status==="Aktif");if(!L.length)return{p:0,big:"0",sub:"Belum ada klien aktif",lbl:"klien"};
  const avg=L.reduce((a,x)=>a+skProg(x),0)/L.length,dk=L.filter(x=>x.tenggat&&Math.round((parse(x.tenggat)-parse(today()))/864e5)<=14).length;
  return{p:avg,big:String(L.length),sub:"Rata-rata "+Math.round(avg*100)+"%",warn:dk?dk+" sidang ≤14 hari":"",lbl:"klien"}}

  const telat=[];Object.keys(S.izin).forEach(k=>{if(inPer(k,per))(S.izin[k]||[]).forEach(x=>{if(x.sid===sid&&x.jenis==="Datang terlambat")telat.push(Object.assign({date:k},x))})});
  const izin=[];Object.keys(S.izin).forEach(k=>{if(inPer(k,per))(S.izin[k]||[]).forEach(x=>{if(x.sid===sid)izin.push(Object.assign({date:k},x))})});
  const bk=S.bk.filter(x=>x.sid===sid&&inPer(x.date,per)).sort((a,b)=>a.date.localeCompare(b.date));
  const roles=ROLES.filter(r=>S.struktur[r[0]]===sid).map(r=>r[1]);const piket=[1,2,3,4,5,6].filter(d=>(S.piket[d]||[]).includes(sid)).map(d=>HARI[d]);
  const P=by("P"),K=by("K"),R=by("R");return{att,pct:pct(att),P,K,R,pP:sum(P),pK:sum(K),pR:sum(R),telat,izin,bk,roles,piket}}
function predHadir(d){if(!d.att.T)return["Belum ada data","#55617A"];const p=d.pct;return p>=95?["Sangat Baik","#2B8A3E"]:p>=90?["Baik","#2B8A3E"]:p>=80?["Cukup","#C25E00"]:["Kurang","#E03131"]}
function predDisiplin(p){return p===0?["Sangat Baik","#2B8A3E","Tidak ada tindakan"]:p<=25?["Baik","#2B8A3E","Teguran lisan dan pembinaan wali kelas"]:p<=50?["Cukup","#C25E00","Peringatan tertulis (SP 1)"]:p<=75?["Kurang","#E03131","SP 2 dan panggilan orang tua"]:p<100?["Sangat Kurang","#E03131","SP 3 dan pembinaan khusus bersama BK"]:["Sangat Kurang","#E03131","Diserahkan kepada pimpinan sekolah"]}
function predAktif(p){return p>=30?["Sangat Aktif","#2B8A3E"]:p>=15?["Aktif","#2B8A3E"]:p>=5?["Cukup Aktif","#C25E00"]:["Perlu Ditingkatkan","#E03131"]}
function autoCatatan(s,d){const nm=title(s.name).split(" ").slice(0,2).join(" ");const ph=predHadir(d)[0].toLowerCase(),pd=predDisiplin(d.pP)[0].toLowerCase(),pa=predAktif(d.pK)[0].toLowerCase();
  let t="Ananda "+nm+(d.att.T?" memiliki tingkat kehadiran "+ph+" ("+String(d.pct).replace(".",",")+"%)":" belum memiliki catatan kehadiran pada periode ini")+". ";
  t+=d.P.length?"Tercatat "+d.P.length+" pelanggaran dengan total "+d.pP+" poin sehingga kedisiplinan berada pada kategori "+pd+". ":"Tidak ada catatan pelanggaran sehingga kedisiplinan ananda sangat baik. ";
  t+=d.K.length?"Dalam kegiatan kelas dan sekolah ananda tergolong "+pa+" dengan "+d.pK+" poin keaktifan. ":"Keaktifan ananda dalam kegiatan kelas dan sekolah masih perlu ditingkatkan. ";

  t+=d.pP>25?"Diharapkan ananda lebih tertib terhadap tata tertib sekolah dengan dukungan orang tua di rumah.":d.R.length||d.pK>=15?"Semoga ananda mempertahankan sikap dan pencapaian yang baik ini.":"Semoga ananda terus berkembang dan lebih percaya diri dalam berbagai kegiatan.";

  async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction("f",mode),st=t.objectStore("f");let out;const q=fn(st);if(q)q.onsuccess=()=>out=q.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx("readwrite",s=>s.put(v,k))},get(k){return this.tx("readonly",s=>s.get(k))},del(k){return this.tx("readwrite",s=>s.delete(k))}};

function gcalUrl(c){const d=c.tgl.replace(/-/g,""),f=t=>t.replace(":","")+"00";let dates;
  if(c.jam){let e=c.jamAkhir||"";if(!e||e<=c.jam){const[h,m]=c.jam.split(":").map(Number);e=pad(Math.min(23,h+1))+":"+pad(m)}dates=d+"T"+f(c.jam)+"/"+d+"T"+f(e)}else{const n=parse(c.tgl);n.setDate(n.getDate()+1);dates=d+"/"+dkey(n).replace(/-/g,"")}
  const rr={harian:"RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR,SA",mingguan:"RRULE:FREQ=WEEKLY",bulanan:"RRULE:FREQ=MONTHLY"}[c.ulang];
  return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(c.judul)+"&dates="+dates+"&ctz=Asia/Jakarta"+(c.tempat?"&location="+encodeURIComponent(c.tempat):"")+(c.ket?"&details="+encodeURIComponent(c.ket):"")+(rr?"&recur="+encodeURIComponent(rr):"")}
function alarmList(){const out=[],now=Date.now(),lim=now+35*864e5;
  S.agendaPri.forEach(x=>{if(x.alarm===""||x.alarm==null||!x.jam)return;const off=(+x.alarm||0)*6e4;
    for(let i=-1;i<=35;i++){const d=new Date();d.setDate(d.getDate()+i);const k=dkey(d);if(!agOn(x,k)||agDone(x,k))continue;const[h,m]=x.jam.split(":").map(Number);const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime()-off;
      if(at>now&&at<lim)out.push({id:x.id+"_"+k,at,title:(x.jenis==="Tugas"?"Tugas: ":x.jenis==="Rapat"?"Rapat: ":"")+x.judul,text:(+x.alarm?ALM[x.alarm].replace(" sebelum"," lagi")+" · ":"Sekarang · ")+x.jam+(x.tempat?" · "+x.tempat:"")})}});
  if(S.diet&&S.diet.alarm){const P=IFP[S.diet.pola]||IFP["16:8"],[h,m]=S.diet.mulai.split(":").map(Number);
    for(let i=0;i<=7;i++){const d=new Date();d.setDate(d.getDate()+i);const st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime(),en=st+P*36e5,k=dkey(d);

function alarmSync(force){const L=alarmList(),sig=JSON.stringify(L);if(!force&&sig===alSig)return L.length;alSig=sig;

function showInvoice(x,cv){const v=x.inv,fn="Invoice "+(x.nama||"").replace(/[\\/:*?"<>|]/g,"")+" "+v.no.replace(/\//g,"-"),t=invTot(v);
  sheet(`<h3>Invoice ${esc(v.no)}</h3><div class="desc">${esc(x.nama)} · Total ${rpJ(t.tot)}${t.sisa?" · sisa "+rpJ(t.sisa):" · lunas"}</div>
  <img class="prev" src="${cv.toDataURL("image/jpeg",.75)}" alt="Pratinjau invoice" style="border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);max-height:48vh;object-fit:contain;width:100%;background:#fff">
  <div class="grid2" style="margin-top:14px"><button class="btn btn-red" id="ivPdf">${ICON.dl} Unduh PDF</button><button class="btn btn-pri" id="ivJpg">${ICON.img} Unduh JPG</button></div>
  ${x.hp?`${waPicker()}<button class="btn btn-wa btn-block" style="margin-top:12px" id="ivWa">${ICON.wa} Kirim ke ${esc(x.nama.split(" ")[0])} lewat WA</button>`:""}
  <button class="btn btn-ghost btn-block" style="margin-top:10px" id="ivEd">${ICON.edit} Ubah Invoice</button>`);
  if(x.hp)bindWaPicker();
  const msg=`Halo Kak ${x.nama.split(" ")[0]}, berikut invoice pesanan *${x.jenis}*.\n\nNo: ${v.no}\nTotal: ${rpJ(t.tot)}${+v.dibayar?"\nDibayar: "+rpJ(v.dibayar):""}\n${t.sisa?"Sisa tagihan: *"+rpJ(t.sisa)+"*":"Status: *LUNAS*"}${S.jasa.cfg.rek&&t.sisa?"\n\nPembayaran:\n"+S.jasa.cfg.rek:""}\n\nTerima kasih.`;
  $("#ivPdf").onclick=async()=>{toast("Menyiapkan PDF…");saveBlob(fn+".pdf",await makePdf([cv]),"Invoice PDF disimpan")};
  $("#ivJpg").onclick=async()=>{const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92));saveBlob(fn+".jpg",b,"Invoice JPG disimpan")};
  const wb=$("#ivWa");if(wb)wb.onclick=async()=>{const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92));if(!await shareBlob(fn+".jpg",b,msg,S.settings.waPkg,phone(x.hp))){saveBlob(fn+".jpg",b,"Invoice disimpan");setTimeout(()=>waSendText(phone(x.hp),msg),600)}};
  $("#ivEd").onclick=()=>invEdit(x.id);if(view==="skD")render(true)}
function jsConfig(){const c=S.jasa.cfg;
  sheet(`<h3>Pengaturan Formulir</h3><div class="desc">Tampilan formulir yang dibuka pelanggan. Simpan untuk memperbarui formulir secara langsung.</div>
  <div class="field"><label>Nama Jasa (judul formulir)</label><input class="inp" id="jcN" value="${esc(c.nama)}"></div>
  <div class="field"><label>Keterangan</label><textarea class="inp" id="jcD" rows="2">${esc(c.deskripsi)}</textarea></div>
  <div class="field"><label>Pilihan Jenis Tugas (satu per baris)</label><textarea class="inp" id="jcJ" rows="6">${esc(c.jenis.join("\n"))}</textarea></div>
  <div class="field"><label>No WhatsApp untuk konfirmasi pelanggan (opsional)</label><input class="inp" id="jcW" type="tel" value="${esc(c.wa)}" placeholder="08xxxxxxxxxx"></div>
  <div class="sec-title" style="margin-top:6px">Data Invoice</div>
  <div class="field"><label>Logo invoice</label><div class="row" style="gap:10px"><img id="jcLg" src="${S.jasa.logo||JASA_LOGO}" alt="Logo invoice" style="width:72px;height:72px;object-fit:contain;border-radius:12px;border:1.5px solid #D9E2F1;background:#fff"><div class="grow" style="display:grid;gap:6px"><button class="btn btn-ghost" id="jcLgU" style="margin:0;padding:9px">${ICON.img} Ganti Logo</button>${S.jasa.logo?`<button class="btn btn-ghost" id="jcLgR" style="margin:0;padding:9px;font-size:12.5px">Pakai logo Aksara bawaan</button>`:""}</div></div><input type="file" id="jcLgF" accept="image/*" hidden></div>
  <div class="field"><label>Nama usaha di invoice</label><input class="inp" id="jcU2" value="${esc(c.usaha||"")}" placeholder="mis. Aksara Bangjoki"></div>
  <div class="field"><label>Nama penanggung jawab (tanda tangan)</label><input class="inp" id="jcP" value="${esc(c.pemilik||"")}" placeholder="Nama Anda"></div>
  <div class="field"><label>Info pembayaran</label><textarea class="inp" id="jcR" rows="3" placeholder="mis. BRI 1234-5678-9012 a.n. Nama&#10;DANA/GoPay 0812xxxxxxx">${esc(c.rek||"")}</textarea></div>
  <div class="sec-title" style="margin-top:6px">Link Formulir</div>
  <div class="field"><label>Link order khusus (opsional)</label><input class="inp" id="jcL" value="${esc(c.link||"")}" placeholder="https://aksarabangjoki.github.io/"><div style="font-size:11.5px;color:var(--mute);margin-top:5px">Isi jika memakai alamat GitHub sendiri untuk formulir order. Link ini yang disalin dan dibagikan.</div></div>
  <div class="field"><label>Alamat web Ruang Tumbuh (GitHub Pages)</label><input class="inp" id="jcU" value="${esc(S.settings.webUrl||"")}" placeholder="https://namaakun.github.io/namarepo/"><div style="font-size:11.5px;color:var(--mute);margin-top:5px">Tempat file pesan.html diunggah. Link formulir dibuat dari alamat ini agar bisa dibuka di HP yang memakai lebih dari satu akun Google.</div></div>
  <div class="field"><label>Status Pemesanan</label><select class="inp" id="jcB"><option value="1" ${c.buka?"selected":""}>Dibuka</option><option value="0" ${c.buka?"":"selected"}>Ditutup sementara</option></select></div>
  <button class="btn btn-pri btn-block" id="jcS">${ICON.check} Simpan &amp; Perbarui Formulir</button>`);
  $("#jcLgU").onclick=()=>$("#jcLgF").click();const lr=$("#jcLgR");if(lr)lr.onclick=()=>{delete S.jasa.logo;save();$("#jcLg").src=JASA_LOGO;lr.remove();toast("Logo bawaan dipakai")};
  $("#jcLgF").onchange=async e=>{const f=e.target.files[0];if(!f)return;const im=await loadImg(URL.createObjectURL(f));if(!im){toast("Gambar tidak bisa dibaca");return}const k=Math.min(1,520/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);S.jasa.logo=cv.toDataURL("image/jpeg",.88);save();$("#jcLg").src=S.jasa.logo;toast("Logo invoice diganti")};

function normPoin(t){return String(t||"").split(/\n+/).map(l=>l.replace(/^\s*([-•*·]|\d+[.)])\s*/,"").trim()).filter(Boolean).map(l=>{l=l.charAt(0).toUpperCase()+l.slice(1);return/[.!?:]$/.test(l)?l:l+"."})}
function infoMsg(s){const d=S.infoDraft,j=INFO_J[d.jenis]||INFO_J["Informasi umum"],jud=(d.judul||"Pengumuman").trim(),pts=normPoin(d.poin);
  const det=[];if(d.tanggal)det.push("🗓️ Hari/Tanggal : "+fmtLong(d.tanggal));if(d.waktu)det.push("⏰ Waktu            : "+d.waktu);if(d.tempat)det.push("📍 Tempat          : "+d.tempat);if(d.batas)det.push("⏳ Batas waktu   : "+fmtLong(d.batas));
  let t="Assalamu'alaikum warahmatullahi wabarakatuh.\n\n{salam} "+(s?"{ortu}":"Bapak/Ibu wali murid kelas {kelas}")+" yang kami hormati. Semoga Bapak/Ibu "+(s?"sekeluarga ":"beserta keluarga ")+"senantiasa sehat dan dalam lindungan Allah SWT.\n\n📢 *PENGUMUMAN*\n*"+jud.toUpperCase()+"*\n\n"+j[0].replace("{judul}",jud);
  if(det.length)t+="\n\n"+det.join("\n");else if(j[0].endsWith(":"))t=t.slice(0,-1)+".";
  if(pts.length)t+="\n\n"+(pts.length>1?"Adapun hal-hal yang perlu Bapak/Ibu perhatikan:\n"+pts.map((p,i)=>(i+1)+". "+p).join("\n"):"Hal yang perlu Bapak/Ibu perhatikan: "+pts[0]);
  if(s)t+="\n\nInformasi ini kami sampaikan khusus berkaitan dengan ananda *{nama}*.";
  t+="\n\n"+j[1]+"\n\nAtas perhatian dan kerja sama Bapak/Ibu kami ucapkan terima kasih.\nWassalamu'alaikum warahmatullahi wabarakatuh.\n\n{ttd}";
  return fillTpl(t,baseMap(s))}

on gambarItem_(it) {\n  const m = it.match(/<enclosure[^>]+url=\"([^\"]+)\"/i) || it.match(/<media:content[^>]+url=\"([^\"]+)\"/i) || it.match(/<media:thumbnail[^>]+url=\"([^\"]+)\"/i) ||\n    it.match(/<img[^>]+src=[\"']([^\"']+)[\"']/i) || it.match(/&lt;img[^&]*?src=(?:&quot;|&#039;|\")([^&\"]+)/i);\n  return m ? m[1].replace(/&amp;/g, '&') : '';\n}\nfunction ogGambar_(list) {\n  const butuh = list.filter(function (a) { return !a.gambar && a.link && !/news\\.google\\./.test(a.link); }).slice(0, 8);\n  if (!butuh.length) return;\n  try {\n    const res = UrlFetchApp.fetchAll(butuh.map(function (a) { return { url: a.link, muteHttpExceptions: true, followRedirects: true, headers: { 'User-Agent': 'Mozilla/5.0' } }; }));\n    res.forEach(function (r, i) {\n      try {\n        if (r.getResponseCode() !== 200) return;\n        const h = r.getContentText().slice(0, 60000);\n        const m = h.match(/<meta[^>]+property=[\"']og:image[\"'][^>]+content=[\"']([^\"']+)[\"']/i) || h.match(/<meta[^>]+content=[\"']([^\"']+)[\"'][^>]+property=[\"']og:image[\"']/i) || h.match(/<meta[^>]+name=[\"']twitter:image[\"'][^>]+content=[\"']([^\"']+)[\"']/i);\n        if (m) butuh[i].gambar = m[1].replace(/&amp;/g, '&');\n      } catch (e) {}\n    });\n  } catch (e) {}\n}\nfunction wawasan_(segar) {\n  const cache = CacheService.getScriptCache(), key = 'wawasan_v2';\n  if (!segar) { const h = cache.get(key); if (h) return JSON.parse(h); }\n  const hasil = {}, batas = Date.now() - 10 * 864e5;\n  Object.keys(SUMBER_WAWASAN).forEach(function (kat) {\n    let semua = [];\n    SUMBER_WAWASAN[kat].forEach(function (s) {\n      try {\n        const r = UrlFetchApp.fetch(s[1], { muteHttpExceptions: true, followRedirects: true, headers: { 'User-Agent': 'Mozilla/5.0' } });\n        if (r.getResponseCode() !== 200) return;\n        const gn = /news\\.google/.test(s[1]);\n        r.getContentText().split(/<item[\\s>]/i).slice(1, 25).forEach(function (it) {\n          const ambil = function (t) { const m = it.match(new RegExp('<' + t + '[^>]*>([\\\\s\\\\S]*?)<\/' + t + '>', 'i')); return m ? bersih_(m[1]) : ''; };\n          let judul = ambil('title'), link = ambil('link'), sumber = s[0];\n          if (gn) { sumber = ambil('source') || 'Google News'; judul = judul.replace(/\\s+-\\s+[^-]+$/, ''); }\n          if (!gn && KATA_WAWASAN[kat] && !KATA_WAWASAN[kat].test(judul + ' ' + ambil('description').slice(0, 300))) return;\n          const d = new Date(ambil('pubDate'));\n          if (!isNaN(d) && d.getTime() < batas) return;\n          if (judul && link) semua.push({ judul: judul, link: link, waktu: isNaN(d) ? '' : d.toISOString(), sumber: sumber, gambar: gn ? '' : gambarItem_(it) });\n        });\n      } catch (e) {}\n    });\n    const lihat = {};\n    semua = semua.filter(function (a) { const k = a.judul.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 50); if (lihat[k]) return false; lihat[k] = 1; return true; })\n      .sort(function (a, b) { return (b.waktu || '').localeCompare(a.waktu || ''); }).slice(0, 16);\n    ogGambar_(semua);\n    const ada = semua.filter(function (a) { return a.gambar; }), tidak = semua.filter(function (a) { return !a.gambar; });\n    hasil[kat] = ada.concat(tidak).slice(0, 10);\n  });\n  if (hasil.otomotif.length || hasil.pendidikan.length || hasil.penelitian.length) cache.put(key, JSON.stringify(hasil), 1800);\n  return hasil;\n}\n";
const gsCb={};
window.__httpCb=(i,status,txt)=>{const c=gsCb[i];if(!c)return;delete gsCb[i];try{c.res(JSON.parse(txt))}catch(e){c.rej(new Error(status?"Respon tidak valid ("+status+"). Periksa URL dan izin akses Web App.":"Tidak ada koneksi internet"))}};
function gsCall(method,params,body){let url=String(S.settings.gsUrl||"").trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))return Promise.reject(new Error("URL Web App belum benar"));
  if(params)url+=(url.includes("?")?"&":"?")+Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  const payload=body?JSON.stringify(body):"";
  if(BR&&BR.http)return new Promise((res,rej)=>{const id="h"+uid();gsCb[id]={res,rej};BR.http(id,method,url,payload)});
  return fetch(url,method==="POST"?{method:"POST",body:payload}:{}).then(r=>r.json()).catch(e=>{throw new Error(navigator.onLine?"Tidak bisa terhubung. Periksa URL dan izin akses Web App.":"Tidak ada koneksi internet")})}
async function syncNow(silent){const st=S.settings;if(!st.gsUrl||!st.gsKey){if(!silent)toast("Isi URL Web App dan kunci dulu");return}if(!S.students.length){if(!silent)toast("Data siswa masih kosong, tidak dikirim ke Drive. Ambil data dari Drive dulu.");return}
  if(syncing)return;syncing=true;if(!silent)toast("Menyinkronkan ke Google Drive…");
  try{const r=await gsCall("POST",null,{kunci:st.gsKey,data:S});if(!r.ok)throw new Error(r.pesan||"Gagal");st.lastSync=r.waktu||new Date().toISOString();st.dirty=false;if(r.url)st.ssUrl=r.url;save(true);if(!silent)toast("Tersinkron ke Google Drive ✓");if(view==="set"&&!$("#ov").classList.contains("show"))render(true)}
  catch(e){if(!silent)toast("Gagal sinkron: "+e.message)}finally{syncing=false}}
function gsGuide(){const code=GS_CODE.replace("'tkr2-rahasia'","'"+(S.settings.gsKey||"tkr2-rahasia").replace(/'/g,"")+"'");
  const steps=[["Buka Apps Script","Buka <b>script.google.com</b> dengan akun Google sekolah atau pribadi, lalu pilih <b>Proyek baru</b>. Lebih mudah dikerjakan dari laptop."],
   ["Tempel kode","Hapus isi bawaan, lalu tempel kode di bawah (tombol <b>Salin Kode</b>). Kunci di baris <b>KUNCI</b> sudah disamakan dengan isian kunci di aplikasi."],
   ["Beri izin","Simpan proyek. Pilih fungsi <b>cobaIzin</b> lalu tekan <b>Jalankan</b>. Izinkan akses Drive dan Sheets (Lanjutan → Buka proyek → Izinkan)."],
   ["Terapkan","Tekan <b>Terapkan → Deployment baru</b>. Jenis: <b>Aplikasi web</b>. Jalankan sebagai: <b>Saya</b>. Akses: <b>Siapa saja</b>. Lalu tekan Terapkan."],
   ["Hubungkan","Salin <b>URL aplikasi web</b> (berakhiran /exec), tempel di kolom URL aplikasi ini, lalu tekan <b>Tes Koneksi</b> dan <b>Sinkron Sekarang</b>."]];
  sheet(`<h3>Menghubungkan Google Drive</h3><div class="desc">Cukup dilakukan sekali. Setelah itu database tersimpan di folder <b>Aplikasi Wali Kelas XI TKR 2</b> di Google Drive beserta Google Sheet rekap keseluruhan.</div>
  <div class="list">${steps.map((s,i)=>`<div class="stu" style="align-items:flex-start"><div class="av" style="background:${AVC[i]}">${i+1}</div><div class="grow"><div class="nm">${s[0]}</div><div class="sub" style="color:var(--txt)">${s[1]}</div></div></div>`).join("")}</div>
  <div class="field" style="margin-top:14px"><label>Kode Apps Script</label><textarea class="inp" readonly rows="8" style="font-family:monospace;font-size:11px">${esc(code)}</textarea></div>
  <div class="grid2"><button class="btn btn-pri" id="gcCopy">${ICON.copy} Salin Kode</button><a class="btn btn-ghost" style="text-decoration:none" href="https://script.google.com/home/projects/create" target="_blank" rel="noopener">Buka Apps Script</a></div>
  <button class="btn btn-ghost btn-block" style="margin-top:10px" id="gcClose">Tutup</button>`);
  $("#gcCopy").onclick=()=>copy(code);$("#gcClose").onclick=()=>closeSheet()}
function checkUpdate(manual){const UB=BR&&BR.checkUpdate?BR:DK;if(!UB||!UB.checkUpdate){if(manual)toast("Pembaruan otomatis hanya tersedia di aplikasi Android dan Windows");return}
  const st=S.settings;if(!st.gsUrl||!st.gsKey){if(manual)toast("Hubungkan Google Drive dulu di menu Atur");return}
  if(manual)toast("Memeriksa pembaruan…");window.__updManual=manual;UB.checkUpdate(st.gsUrl.trim(),st.gsKey,APP_VER)}
const DEVKEYS=["gsUrl","gsKey","ssUrl","waPkg","autoSync"];
async function applyRemote(silent){const st=S.settings;if(!silent)toast("Mengambil data dari Drive…");
  try{const r=await gsCall("GET",{kunci:st.gsKey,aksi:"ambil"});if(!r.ok||!r.data||!Array.isArray(r.data.students))throw new Error(r.pesan||"Data di Drive kosong");if(!r.data.students.length&&S.students.length){toast("Data di Drive kosong. Data di perangkat ini dipertahankan.");return}
    const keep={};DEVKEYS.forEach(k=>keep[k]=st[k]);localStorage.setItem(KEY,JSON.stringify(r.data));S=load();Object.assign(S.settings,keep,{lastSync:r.waktu||new Date().toISOString(),dirty:false});save(true);
    if(!$("#ov").classList.contains("show"))render(true);toast(silent?"Data terbaru dari Drive dimuat ✓":"Data dari Drive berhasil dimuat ✓")}
  catch(e){if(!silent)toast("Gagal: "+e.message)}}
function restoreData(d,label){if(!d||!Array.isArray(d.students)||!d.att){toast("File bukan cadangan aplikasi Wali Kelas");return}
  if(!d.students.length){toast("Cadangan ini tidak berisi data siswa");return}
  const st=S.settings,keep={};DEVKEYS.forEach(k=>keep[k]=st[k]);localStorage.setItem(KEY,JSON.stringify(d));S=load();Object.assign(S.settings,keep,{dirty:true});save(true);render(true);
  toast("Dipulihkan dari "+label+" · "+S.students.length+" siswa, "+Object.keys(S.att).length+" hari absensi");
  if(S.settings.gsUrl&&S.settings.gsKey)setTimeout(()=>syncNow(true),800)}
async function backupDrive(){const st=S.settings;if(!st.gsUrl||!st.gsKey){toast("Hubungkan Google Drive dulu");return}toast("Membaca cadangan di Drive…");
  try{const r=await gsCall("GET",{kunci:st.gsKey,aksi:"daftar"});if(!r.ok)throw new Error(r.pesan||"Gagal");
    sheet(`<h3>Pulihkan dari Cadangan Drive</h3><div class="desc">Pilih file. Data di perangkat ini akan diganti lalu dikirim kembali ke Drive sebagai data terbaru.</div>
    <div class="list">${(r.file||[]).map(f=>`<div class="stu" data-bf="${esc(f.nama)}" style="${f.siswa?"":"opacity:.55"}"><div class="av" style="background:${f.siswa?"#1E3A8A":"#A8B3C7"}">${ICON.doc}</div><div class="grow"><div class="nm">${esc(f.nama)}</div><div class="sub">${f.siswa} siswa · ${f.hari} hari absensi · ${Math.max(1,Math.round(f.ukuran/1024))} KB · ${fmtTime(f.waktu)}</div></div></div>`).join("")||'<div class="empty">Belum ada file cadangan</div>'}</div>
    <button class="btn btn-ghost btn-block" style="margin-top:12px" id="bfClose">Tutup</button>`);
    $("#bfClose").onclick=()=>closeSheet(true);
    $$("#sheet [data-bf]").forEach(el=>el.onclick=()=>{const n=el.dataset.bf;confirmBox("Pulihkan "+n+"?","Data di perangkat ini akan diganti dengan isi file tersebut.","Pulihkan",async()=>{toast("Mengambil "+n+"…");try{const x=await gsCall("GET",{kunci:st.gsKey,aksi:"ambil",file:n});if(!x.ok)throw new Error(x.pesan);restoreData(x.data,n)}catch(e){toast("Gagal: "+e.message)}})})}
  catch(e){toast("Gagal: "+e.message+". Pastikan kode Apps Script sudah versi terbaru.")}}
let pulling=false,lastPull=0;
async function pullCheck(force){const st=S.settings;if(pulling||!st.gsUrl||!st.gsKey||!navigator.onLine)return;if(!force&&Date.now()-lastPull<60000)return;pulling=true;lastPull=Date.now();
  try{const r=await gsCall("GET",{kunci:st.gsKey,aksi:"info"});if(!r.ok||!r.waktu)return;const remote=new Date(r.waktu).getTime(),last=st.lastSync?new Date(st.lastSync).getTime():0;
    if(remote>last+3000){if(!st.dirty)await applyRemote(true);else if(!$("#ov").classList.contains("show")){
      sheet(`<h3>Data Berbeda</h3><div class="desc">Data di Google Drive sudah diperbarui dari perangkat lain, sementara perangkat ini juga punya perubahan yang belum terkirim. Pilih data yang akan dipakai.</div>
      <button class="btn btn-pri btn-block" id="cfDrive">${ICON.dl} Pakai Data dari Drive</button><button class="btn btn-ghost btn-block" style="margin-top:10px" id="cfLocal">${ICON.send} Pakai Data Perangkat Ini</button>
      <div style="font-size:12px;color:var(--mute);margin-top:10px;text-align:center">Data yang tidak dipilih akan tertimpa.</div>`);
      $("#cfDrive").onclick=()=>{closeSheet(true);applyRemote(false)};$("#cfLocal").onclick=()=>{closeSheet(true);syncNow(false)}}}
    else if(st.dirty&&st.autoSync)syncNow(true)}catch(e){}finally{pulling=false}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullCheck(false)});
window.__updCb=(st,ver,msg)=>{if(st==="ready"){sheet(`<h3>Pembaruan Tersedia</h3><div class="desc">Versi <b>${esc(ver)}</b> sudah diunduh (versi sekarang ${APP_VER}). Data siswa dan absensi tidak berubah.</div>
    <button class="btn btn-pri btn-block" id="upGo">${ICON.check} Pakai Versi Baru Sekarang</button><button class="btn btn-ghost btn-block" style="margin-top:10px" id="upLater">Nanti Saja</button>
    <div style="font-size:12px;color:var(--mute);margin-top:10px;text-align:center">Jika memilih nanti, versi baru otomatis dipakai saat aplikasi dibuka berikutnya.</div>`);
    $("#upGo").onclick=()=>{save(true);(BR&&BR.reloadApp?BR:DK).reloadApp()};$("#upLater").onclick=()=>closeSheet(true)}
  else if(window.__updManual)toast(st==="latest"?"Aplikasi sudah versi terbaru ("+APP_VER+")":"Gagal memeriksa: "+(msg||"periksa koneksi internet"))};
window.appBack=()=>{if($("#ov").classList.contains("show")){closeSheet(true);return true}if(view==="nilaiEd"){go("nilai");return true}if(view==="catatanSw"){go("catatan");return true}if(SUB[view]){go("menu");return true}if(view!=="home"){go("home");return true}return false};

  $("#spHello").innerHTML=(h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam")+",<br><b>"+esc(S.settings.wali)+"</b>";const sq=$("#spQuote");if(sq)sq.textContent="“"+SEMANGAT[Math.floor(Math.random()*SEMANGAT.length)]+"”";
  let done=false;const close=()=>{if(done)return;done=true;splashDone=true;sp.classList.add("out");setTimeout(()=>{sp.remove();go(view)},560)};
  sp.onclick=close;setTimeout(close,2700)})();
setTimeout(()=>checkUpdate(false),5000);setTimeout(()=>pullCheck(true),3200);
go("home");
})();
