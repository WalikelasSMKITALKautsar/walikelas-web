<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1A0B4B">
<meta name="robots" content="noindex,nofollow">
<title>Arena Kuis</title>
<meta property="og:title" content="Arena Kuis">
<meta property="og:description" content="Jawab soal secepat mungkin, kumpulkan poin dan rebut puncak papan skor.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--u1:#1A0B4B;--u2:#3B1C8C;--u3:#6D28D9;--emas:#FFD43B;--pink:#FF4FA3;--cyan:#22D3EE}
html,body{min-height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif;color:#fff;background:radial-gradient(1200px 800px at 80% -10%,#7C3AED55,transparent 60%),radial-gradient(900px 700px at -10% 110%,#EC489955,transparent 60%),linear-gradient(160deg,var(--u1),var(--u2) 55%,#2A1170);min-height:100vh;overflow-x:hidden}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx i{position:absolute;bottom:-60px;font-style:normal;font-family:Fredoka,sans-serif;font-weight:700;color:rgba(255,255,255,.09);animation:naik linear infinite}
@keyframes naik{to{transform:translateY(-120vh) rotate(360deg)}}
.w{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:18px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
.judul{font-family:Fredoka,sans-serif;font-weight:700;letter-spacing:.5px}
.top{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.chip.emas{background:linear-gradient(135deg,#FFD43B,#FAB005);color:#3B2A05;border:0}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.kartu{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero{text-align:center;padding:26px 6px 10px}
.logo{width:110px;height:110px;margin:0 auto;border-radius:32px;background:linear-gradient(135deg,var(--emas),#FF922B);display:grid;place-items:center;font-size:58px;box-shadow:0 20px 50px -15px #FFD43B99;animation:goyang 2.6s ease-in-out infinite}
@keyframes goyang{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
.hero h1{font-family:Fredoka,sans-serif;font-size:34px;margin-top:18px;line-height:1.1;background:linear-gradient(90deg,#fff,#FFE066,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:kilau 3s linear infinite}
@keyframes kilau{to{background-position:-200% 0}}
.hero p{opacity:.85;margin-top:8px;font-size:14px;line-height:1.5}
.teka{margin:16px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.teka span{background:rgba(255,255,255,.1);border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:700}
label{display:block;font-size:13px;font-weight:800;margin:14px 0 7px;opacity:.9}
select,input{width:100%;padding:14px;border-radius:15px;border:2px solid rgba(255,255,255,.2);background:rgba(10,4,40,.45);color:#fff;font-size:16px;font-weight:700;outline:none;font-family:inherit}
select option{color:#111}
select:focus,input:focus{border-color:var(--emas)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{aspect-ratio:1;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.1);font-size:28px;cursor:pointer;transition:transform .15s}
.avs button.on{border-color:var(--emas);background:rgba(255,212,59,.22);transform:scale(1.08)}
.btn{display:block;width:100%;margin-top:18px;padding:17px;border:0;border-radius:18px;font-family:Fredoka,sans-serif;font-size:21px;font-weight:700;letter-spacing:.5px;color:#3B2A05;background:linear-gradient(135deg,#FFE066,#FAB005);box-shadow:0 8px 0 #C47F00,0 18px 30px -10px #FAB00599;cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #C47F00}
.btn:disabled{opacity:.6}
.btn.ung{background:linear-gradient(135deg,#A78BFA,#7C3AED);color:#fff;box-shadow:0 8px 0 #4C1D95}
.er{background:rgba(255,80,80,.18);border:1px solid rgba(255,120,120,.5);border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:700;margin-top:12px;display:none}
.pusat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hit{font-family:Fredoka,sans-serif;font-size:150px;font-weight:700;line-height:1;text-shadow:0 10px 40px #FFD43B88;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.prog{display:flex;gap:4px;margin:14px 0 10px}
.prog i{flex:1;height:7px;border-radius:7px;background:rgba(255,255,255,.15)}
.prog i.b{background:#40C057}.prog i.s{background:#FA5252}.prog i.n{background:var(--emas);animation:kedip 1s infinite}
@keyframes kedip{50%{opacity:.4}}
.wkt{height:12px;border-radius:12px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:14px}
.wkt b{display:block;height:100%;width:100%;border-radius:12px;background:linear-gradient(90deg,#40C057,#FFD43B);transform-origin:left;transition:background .3s}
.wkt b.krit{background:linear-gradient(90deg,#FA5252,#FF922B)}
.soal{background:#fff;color:#1A1240;border-radius:26px;padding:22px 20px;font-size:19px;font-weight:800;line-height:1.45;text-align:center;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);animation:masuk .45s cubic-bezier(.2,1.3,.4,1) both;white-space:pre-wrap;position:relative}
.soal img{display:block;max-width:100%;max-height:220px;margin:12px auto 0;border-radius:14px}
.soal .no{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--u3);color:#fff;font-size:12.5px;padding:5px 14px;border-radius:99px;white-space:nowrap}
@keyframes masuk{from{transform:translateY(30px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.op{position:relative;min-height:96px;border:0;border-radius:20px;padding:14px 12px 14px 46px;color:#fff;font-size:15.5px;font-weight:800;text-align:left;cursor:pointer;line-height:1.35;font-family:inherit;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .12s,opacity .3s,filter .3s;animation:masuk .4s both}
.op:nth-child(2){animation-delay:.06s}.op:nth-child(3){animation-delay:.12s}.op:nth-child(4){animation-delay:.18s}
.op:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.op .bt{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.9}
.op.A{background:#E21B3C}.op.B{background:#1368CE}.op.C{background:#D89E00}.op.D{background:#26890C}
.op.pilih{outline:4px solid #fff;outline-offset:3px;animation:denyut .7s infinite}
@keyframes denyut{50%{transform:scale(1.04)}}
.op.redup{opacity:.35;filter:grayscale(.6)}
.op.benar{outline:4px solid #69DB7C;outline-offset:3px;opacity:1;filter:none}
.op.benar:after{content:"✓";position:absolute;right:10px;top:8px;width:28px;height:28px;border-radius:50%;background:#fff;color:#2B8A3E;display:grid;place-items:center;font-size:17px}
.op.salah{animation:geleng .4s}
@keyframes geleng{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(max-width:380px){.ops{grid-template-columns:1fr}.op{min-height:68px}}
.cek{font-family:Fredoka,sans-serif;font-size:22px;margin-top:16px;opacity:.9;animation:kedip 1s infinite}
.vonis{font-family:Fredoka,sans-serif;font-size:46px;font-weight:700;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.vonis.ok{color:#8CE99A;text-shadow:0 8px 30px #40C05788}.vonis.no{color:#FFA8A8}
.plus{font-family:Fredoka,sans-serif;font-size:40px;font-weight:700;color:var(--emas);margin-top:6px;animation:melayang 1.3s ease-out both}
@keyframes melayang{0%{transform:translateY(20px) scale(.6);opacity:0}30%{opacity:1;transform:translateY(0) scale(1.15)}100%{transform:translateY(-10px) scale(1)}}
.api{font-size:15px;font-weight:800;margin-top:6px;color:#FFC078}
.peringkat{margin-top:22px;width:100%}
.rk{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:22px;padding:14px 16px;text-align:left}
.rk .nmr{font-family:Fredoka,sans-serif;font-size:44px;font-weight:700;min-width:70px;text-align:center;color:var(--emas)}
.rk small{display:block;opacity:.8;font-size:12.5px;font-weight:700}.rk b{font-size:20px}
.gerak{font-size:13px;font-weight:800;margin-top:3px}.gerak.up{color:#8CE99A}.gerak.dn{color:#FFA8A8}
.top3{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.top3 div{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;animation:masuk .4s both}
.top3 div:nth-child(2){animation-delay:.1s}.top3 div:nth-child(3){animation-delay:.2s}
.top3 em{font-style:normal;margin-left:auto;color:var(--emas)}
.misteri{width:160px;height:160px;margin:0 auto;position:relative}
.kotak{position:absolute;inset:30px 20px 0;border-radius:16px;background:linear-gradient(135deg,#FF4FA3,#C2255C);box-shadow:0 20px 40px -10px #FF4FA399;animation:goncang .5s infinite}
.kotak:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--emas)}
.tutup{position:absolute;left:10px;right:10px;top:12px;height:34px;border-radius:12px;background:linear-gradient(135deg,#FF6EB4,#D6336C);z-index:2;animation:goncang .5s infinite}
.tutup:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:#FFE066}
.tutup:after{content:"🎀";position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:38px}
.misteri.buka .tutup{animation:terbang .7s forwards}.misteri.buka .kotak{animation:none}
@keyframes goncang{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes terbang{to{transform:translateY(-140px) rotate(-35deg);opacity:0}}
.sinar{position:absolute;inset:-60px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#FFD43B55,transparent 20%,#FF4FA355,transparent 40%,#FFD43B55,transparent 60%,#22D3EE55,transparent 80%);animation:putar 3s linear infinite;opacity:0;transition:opacity .4s}
.misteri.buka .sinar{opacity:1}
@keyframes putar{to{transform:rotate(360deg)}}
.x2{font-family:Fredoka,sans-serif;font-size:58px;font-weight:700;color:var(--emas);text-shadow:0 0 30px #FFD43B;margin-top:10px;opacity:0}
.misteri.buka+.x2{animation:pop .7s .35s cubic-bezier(.2,1.6,.4,1) both}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:26px;height:280px;width:100%}
.pd{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;opacity:0}
.pd.on{animation:naikPd .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes naikPd{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
.pd .av{font-size:44px;animation:goyang 2s infinite}.pd .nm{font-weight:800;font-size:13.5px;margin-top:4px;text-align:center;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis}.pd .sk{font-size:12.5px;color:var(--emas);font-weight:800}
.pd .tg{width:100%;margin-top:8px;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:38px;font-weight:700}
.pd.p1 .tg{height:150px;background:linear-gradient(180deg,#FFE066,#FAB005);color:#7A4F00}
.pd.p2 .tg{height:110px;background:linear-gradient(180deg,#E9ECEF,#ADB5BD);color:#495057}
.pd.p3 .tg{height:80px;background:linear-gradient(180deg,#FFC9A0,#E8590C);color:#7A2E00}
.mahkota{font-size:30px;margin-bottom:-8px;animation:goyang 1.6s infinite}
.drum{font-family:Fredoka,sans-serif;font-size:26px;margin-top:20px}
.lst{width:100%;margin-top:16px;display:flex;flex-direction:column;gap:6px;text-align:left}
.lst div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:9px 12px;font-size:14px;font-weight:700}
.lst div.aku{background:rgba(255,212,59,.22);outline:2px solid var(--emas)}
.lst span.n{width:26px;text-align:center;opacity:.8}.lst em{font-style:normal;margin-left:auto;color:var(--emas);font-weight:800}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
/* ===== papan skor (layar proyektor) ===== */
body.papan .w{max-width:1100px}
.pp-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pp-h h1{font-family:Fredoka,sans-serif;font-size:34px;line-height:1.1}
.pp-st{display:flex;gap:10px;margin-left:auto}
.pp-st div{background:rgba(255,255,255,.1);border-radius:18px;padding:10px 16px;text-align:center;min-width:96px}.pp-st b{display:block;font-family:Fredoka,sans-serif;font-size:30px}.pp-st small{font-size:12px;font-weight:700;opacity:.8}
.pp-link{margin-top:14px;background:rgba(0,0,0,.25);border-radius:16px;padding:12px 16px;font-size:15px;font-weight:700;word-break:break-all}.pp-link b{color:var(--emas)}
.pp-l{position:relative;margin-top:18px}
.pp-r{position:absolute;left:0;right:0;height:62px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.08);transition:transform .8s cubic-bezier(.2,1,.3,1),background .4s;overflow:hidden}
.pp-r .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(124,58,237,.55),rgba(236,72,153,.35));border-radius:18px;transition:width .9s cubic-bezier(.2,1,.3,1);z-index:0}
.pp-r>*{position:relative;z-index:1}
.pp-r .n{font-family:Fredoka,sans-serif;font-size:26px;width:44px;text-align:center}
.pp-r .av{font-size:32px}.pp-r .nm{font-weight:800;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp-r .nm small{font-weight:600;opacity:.7;font-size:13px;margin-left:6px}
.pp-r .sk{font-family:Fredoka,sans-serif;font-size:26px;color:var(--emas);min-width:110px;text-align:right}
.pp-r.r1{background:rgba(255,212,59,.18)}.pp-r.r2{background:rgba(233,236,239,.14)}.pp-r.r3{background:rgba(255,169,77,.14)}
.pp-r .fl{font-size:14px;font-weight:800;color:#FFC078}
.pp-r.naik{animation:nyala 1.2s}
@keyframes nyala{0%{box-shadow:0 0 0 0 #FFD43B}40%{box-shadow:0 0 0 6px #FFD43B88}100%{box-shadow:0 0 0 0 transparent}}
.kosong{text-align:center;opacity:.8;padding:40px 10px;font-size:16px}
/* ===== pustaka game ===== */
.lib-h{position:relative;margin-top:14px;border-radius:26px;overflow:hidden;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);transition:background .5s}
.lib-h canvas{position:relative;display:block;width:100%;height:min(42vh,300px);transition:opacity .4s}
.lib-v{position:absolute;left:0;right:0;top:calc(min(42vh,300px) - 40px);height:40px;background:linear-gradient(180deg,rgba(10,4,40,0),rgba(10,4,40,.85));pointer-events:none}
.lib-i{position:relative;padding:14px 16px 16px;background:rgba(10,4,40,.85);animation:masuk .5s both}
.lib-i h2{font-family:Fredoka,sans-serif;font-size:30px;line-height:1.1;margin-top:6px;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.lib-i p{font-size:13.5px;line-height:1.5;opacity:.92;margin-top:6px}.lib-i small{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.16);border-radius:10px;padding:5px 10px}
.lib-g{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--emas);color:#3B2A05;border-radius:8px;padding:4px 8px}
.lib-l{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin:16px 2px 8px}
.lib-t{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}.lib-t::-webkit-scrollbar{display:none}
.lt{flex:none;width:112px;scroll-snap-align:center;border:3px solid transparent;border-radius:20px;padding:12px 8px;background:linear-gradient(150deg,var(--a),var(--b));color:#fff;cursor:pointer;font-family:inherit;text-align:center;transition:transform .2s,border-color .2s,box-shadow .2s;animation:masuk .45s both;opacity:.82}
.lt .lt-i{display:block;font-size:40px;line-height:1.1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}.lt b{display:block;font-size:13px;margin-top:6px;line-height:1.2}.lt small{display:block;font-size:10.5px;font-weight:700;opacity:.85;margin-top:3px}
.lt.on{border-color:#fff;transform:translateY(-6px) scale(1.06);box-shadow:0 14px 28px -10px var(--a),0 0 0 4px rgba(255,212,59,.5);opacity:1}.lt.on .lt-i{animation:goyang 1.6s infinite}
.lib-p{text-align:center;font-size:12px;opacity:.7;margin-top:12px;line-height:1.5}
/* ===== layar game ===== */
body.lagi-main{overflow:hidden}body.lagi-main .fx{display:none}
.gw{position:fixed;inset:0;z-index:5;overflow:hidden;background:#000}
.gw canvas#gc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ghud{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:10px;z-index:3;pointer-events:none}
.ghud .chip{background:rgba(10,4,40,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 10px;font-size:12.5px}.ghud .chip.emas{background:linear-gradient(135deg,#FFD43B,#FAB005)}
.ghint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(10,4,40,.75);border-radius:99px;padding:10px 16px;font-size:13.5px;font-weight:800;white-space:nowrap;z-index:3;pointer-events:none;transition:opacity .6s;animation:kedip 1.4s 3}
.ghint.hilang{opacity:0}
.gq{position:absolute;left:10px;right:10px;max-width:640px;margin:0 auto;z-index:4;background:rgba(18,8,58,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:12px;opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,1.3,.4,1),opacity .3s;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);max-height:calc(100% - 70px);overflow:auto}
.gq.on{opacity:1;pointer-events:auto;transform:none!important}
.gq.bawah{bottom:10px;transform:translateY(110%)}.gq.atas{top:52px;transform:translateY(-120%);max-height:48%}
.gq-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:8px}.gq-h span{background:linear-gradient(135deg,#7048E8,#E64980);padding:5px 12px;border-radius:99px}
.gq .wkt{height:9px;margin-bottom:10px}
.gq-s{background:#fff;color:#1A1240;border-radius:18px;padding:14px;font-size:17px;font-weight:800;line-height:1.4;text-align:center;white-space:pre-wrap}.gq-s.kecil{font-size:15px;padding:11px}.gq-s img{display:block;max-width:100%;max-height:150px;margin:8px auto 0;border-radius:12px}
.gq .ops{margin-top:10px;gap:8px}.gq .op{min-height:62px;font-size:14px;padding:10px 10px 10px 40px}
.gq-o{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.gq-o div{display:flex;gap:7px;align-items:flex-start;border-radius:12px;padding:7px 9px;font-size:12.5px;font-weight:700;line-height:1.3;color:#fff;transition:opacity .3s,outline .3s}.gq-o i{font-style:normal;font-weight:800;white-space:nowrap}
.gq-o .A{background:#E21B3C}.gq-o .B{background:#1368CE}.gq-o .C{background:#D89E00}.gq-o .D{background:#26890C}
.gq-o .redup{opacity:.4}.gq-o .pilih{outline:3px solid #fff}.gq-o .benar{outline:3px solid #69DB7C;opacity:1}.gq-o .benar:after{content:" ✓";font-weight:800}
.gq-f{text-align:center;font-size:13.5px;font-weight:800;margin-top:8px;min-height:18px}
