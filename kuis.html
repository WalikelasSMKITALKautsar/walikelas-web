function acak(arr,seed){var a=arr.slice(),h=0;for(var i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;for(var j=a.length-1;j>0;j--){h=(h*1103515245+12345)>>>0;var r=h%(j+1),t=a[j];a[j]=a[r];a[r]=t}return a}
function pidku(){var k="ks_pid_"+KID,v=ambil(k);if(!v){v=Math.random().toString(36).slice(2,10)+Date.now().toString(36);simpan(k,v)}return v}

/* ================= LOBI ================= */
function lobi(){var av=ambil("ks_av")||AV[Math.floor(Math.random()*AV.length)],kel=K.kelas||[];
  app.innerHTML='<div class="top"><span class="chip">🎮 Arena Kuis</span><span class="sp"></span><button class="ib" id="snd">'+(suara?"🔊":"🔇")+'</button></div>'+
  '<div class="hero"><div class="logo">🏆</div><h1>'+e(K.judul)+'</h1><p>'+e([K.mapel,K.guru].filter(Boolean).join(" · "))+'</p>'+
  '<div class="teka"><span>❓ '+K.soal.length+' soal</span><span>⏱️ '+K.waktu+' detik / soal</span>'+(K.soal.some(function(x){return x.m})?'<span>🎁 Ada soal misteri</span>':'')+'<span>🔥 Bonus beruntun</span></div></div>'+
  '<div class="kartu" style="margin-top:10px">'+(kel.length?'<label>Kelas</label><select id="kl"><option value="">Pilih kelas</option>'+kel.map(function(k,i){return'<option value="'+i+'">'+e(k.nama)+'</option>'}).join("")+'</select><label>Nama</label><select id="nm" disabled><option value="">Pilih kelas dulu</option></select>':'<label>Nama panggilanmu</label><input id="nm" maxlength="40" placeholder="Tulis namamu" autocomplete="off">')+
  '<label>Pilih avatar</label><div class="avs" id="avs">'+AV.map(function(a){return'<button type="button" data-a="'+a+'" class="'+(a===av?"on":"")+'">'+a+'</button>'}).join("")+'</div>'+
  '<div class="er" id="er"></div><button class="btn" id="go">MASUK ARENA</button></div>'+
  '<p style="text-align:center;font-size:12.5px;opacity:.7;margin-top:14px;line-height:1.5">Makin cepat menjawab benar, makin besar poinnya. Jawaban langsung tercatat di papan skor.</p>';
  $("snd").onclick=function(){suara=!suara;this.textContent=suara?"🔊":"🔇"};
  [].forEach.call(document.querySelectorAll("[data-a]"),function(b){b.onclick=function(){av=b.dataset.a;[].forEach.call(document.querySelectorAll("[data-a]"),function(x){x.className=x===b?"on":""});bunyi("tik")}});
  var nmEl=$("nm"),klEl=$("kl"),lastNm=ambil("ks_nama"),lastKl=ambil("ks_kelas");
  if(klEl){klEl.onchange=function(){var k=kel[+klEl.value];nmEl.disabled=!k;nmEl.innerHTML=k?'<option value="">Pilih namamu</option>'+k.siswa.map(function(n){return'<option'+(n===lastNm?" selected":"")+'>'+e(n)+'</option>'}).join(""):'<option value="">Pilih kelas dulu</option>'};
    kel.forEach(function(k,i){if(k.nama===lastKl){klEl.value=i;klEl.onchange()}})}else if(lastNm)nmEl.value=lastNm;
  $("go").onclick=function(){var er=$("er"),nama=String(nmEl.value||"").trim(),kls=klEl?(kel[+klEl.value]||{}).nama||"":"";er.style.display="none";
    if(klEl&&!kls){er.textContent="Pilih kelas dulu.";er.style.display="block";return}if(nama.length<2){er.textContent="Pilih atau tulis namamu dulu.";er.style.display="block";return}
    var b=this;b.disabled=true;b.textContent="MEMASUKI ARENA…";simpan("ks_av",av);simpan("ks_nama",nama);simpan("ks_kelas",kls);
    me={pid:pidku(),nama:nama,kelas:kls,av:av};
    post({aksi:"kuisGabung",k:KID,pid:me.pid,nama:nama,kelas:kls,av:av}).then(function(r){if(!r.ok)throw new Error(r.pesan||"Gagal masuk");
      jawab=r.jawab||{};skor=r.skor||0;streak=r.streak||0;urut=K.acak?acak(K.soal,me.pid):K.soal.slice();idx=urut.findIndex(function(x){return!jawab[x.id]});
      if(idx<0||r.selesai){akhir();return}hitung()}).catch(function(x){b.disabled=false;b.textContent="MASUK ARENA";er.textContent=x.message||"Tidak bisa terhubung. Periksa internet.";er.style.display="block"})}}

/* ================= HITUNG MUNDUR ================= */
function hitung(){var n=3;var t=function(){app.innerHTML='<div class="pusat"><div style="font-size:16px;font-weight:800;opacity:.85">'+(idx?"Lanjutkan permainan, ":"Bersiap, ")+e(me.av+" "+me.nama.split(" ")[0])+'!</div><div class="hit" style="margin-top:10px">'+(n||"GO!")+'</div></div>';bunyi(n?"tik":"go");if(n--===0)setTimeout(main,700);else setTimeout(t,850)};t()}

/* ================= SOAL ================= */
var tmr=0,mulai=0,kunci=false;
function bilahProg(){return'<div class="prog">'+urut.map(function(x,i){var j=jawab[x.id];return'<i class="'+(j?(j.b?"b":"s"):i===idx?"n":"")+'"></i>'}).join("")+'</div>'}
function kepala(){return'<div class="top"><span class="chip">'+e(me.av)+' '+e(me.nama.split(" ")[0])+'</span>'+(streak>=2?'<span class="chip" style="color:#FFC078">🔥 '+streak+'</span>':'')+'<span class="sp"></span><span class="chip emas">⭐ <span id="skr">'+fmt(skor)+'</span></span></div>'}
function main(){if(idx>=urut.length||idx<0){akhir();return}var Q=urut[idx];if(Q.m){misteri(Q);return}tampilSoal(Q)}
function misteri(Q){app.innerHTML=kepala()+'<div class="pusat"><div style="font-family:Fredoka,sans-serif;font-size:24px;margin-bottom:26px">Soal ke-'+(idx+1)+' adalah…</div><div class="misteri" id="ms"><div class="sinar"></div><div class="tutup"></div><div class="kotak"></div></div><div class="x2">SOAL MISTERI · POIN 2×</div><p style="margin-top:10px;opacity:.8;font-weight:700">Ketuk kotaknya!</p></div>';
  var ms=$("ms"),buka=function(){if(ms.classList.contains("buka"))return;ms.classList.add("buka");bunyi("kotak");konfeti(60);setTimeout(function(){tampilSoal(Q)},1900)};ms.onclick=buka;setTimeout(buka,2600)}
function tampilSoal(Q){kunci=false;var W=K.waktu*1000,L="ABCD";
  app.innerHTML=kepala()+bilahProg()+'<div class="wkt"><b id="wb"></b></div>'+
  '<div class="soal"><span class="no">Soal '+(idx+1)+' dari '+urut.length+(Q.m?' · 🎁 2× poin':'')+'</span>'+e(Q.q)+(Q.img?'<img src="'+e(Q.img)+'" alt="">':'')+'</div>'+
  '<div class="ops">'+Q.o.map(function(o,i){var h=L.charAt(i);return'<button class="op '+h+'" data-h="'+h+'"><span class="bt">'+BT[h]+'</span>'+e(o)+'</button>'}).join("")+'</div>'+
  '<div style="text-align:center;margin-top:14px;font-size:13px;font-weight:800;opacity:.85" id="sisa"></div>';
  var wb=$("wb"),ss=$("sisa"),lastS=-1;mulai=performance.now();
  var jalanT=function(){var el=performance.now()-mulai,f=Math.max(0,1-el/W),sd=Math.ceil((W-el)/1000);wb.style.transform="scaleX("+f+")";wb.className=f<.3?"krit":"";if(sd!==lastS){lastS=sd;ss.textContent=sd>0?"⏱️ "+sd+" detik":"";if(sd<=5&&sd>0)bunyi("tik")}
    if(el>=W){kirim(Q,"",W);return}if(!kunci)tmr=requestAnimationFrame(jalanT)};tmr=requestAnimationFrame(jalanT);
  [].forEach.call(document.querySelectorAll(".op"),function(b){b.onclick=function(){if(kunci)return;kirim(Q,b.dataset.h,performance.now()-mulai)}})}
function kirim(Q,h,ms){if(kunci)return;kunci=true;cancelAnimationFrame(tmr);
  [].forEach.call(document.querySelectorAll(".op"),function(b){if(b.dataset.h===h)b.classList.add("pilih");else b.classList.add("redup")});
  var ss=$("sisa");if(ss)ss.innerHTML='<span class="cek">🥁 Memeriksa jawaban…</span>';
  var coba=0,go=function(){post({aksi:"kuisJawab",k:KID,pid:me.pid,qid:Q.id,a:h,ms:Math.round(ms)}).then(function(r){if(!r.ok)throw new Error(r.pesan||"gagal");hasil(Q,h,r)}).catch(function(x){if(++coba<4){setTimeout(go,1200*coba);return}if(ss)ss.innerHTML='<span style="color:#FFA8A8">Koneksi terputus. </span><button class="chip" id="ul">Kirim ulang</button>';var u=$("ul");if(u)u.onclick=function(){coba=0;ss.innerHTML='<span class="cek">🥁 Memeriksa jawaban…</span>';go()}})};go()}
function hasil(Q,h,r){jawab[Q.id]={a:h,b:r.benar?1:0,p:r.poin};var lama=skor;skor=r.skor;streak=r.streak;
  [].forEach.call(document.querySelectorAll(".op"),function(b){b.classList.remove("pilih");if(b.dataset.h===r.kunci){b.classList.remove("redup");b.classList.add("benar")}else if(b.dataset.h===h){b.classList.add("salah")}});
  bunyi(r.benar?"ok":"no");if(r.benar)konfeti(r.streak>=3?140:70);
  setTimeout(function(){posisi(Q,h,r,lama)},1500)}
function posisi(Q,h,r,lama){var naik=rankLama?rankLama-r.rank:0;rankLama=r.rank;
  app.innerHTML=kepala()+bilahProg()+'<div class="pusat">'+
  '<div class="vonis '+(r.benar?"ok":"no")+'">'+(r.benar?["MANTAP!","LUAR BIASA!","TEPAT SEKALI!","KEREN!"][idx%4]:h?"BELUM TEPAT":"WAKTU HABIS")+'</div>'+
  (r.benar?'<div class="plus">+'+fmt(r.poin)+'</div>':'<div style="margin-top:8px;font-weight:700;opacity:.85">Jawaban benar: <b>'+e(r.kunci)+'</b> '+BT[r.kunci]+'</div>')+
  (r.streak>=2?'<div class="api">🔥 '+r.streak+' benar beruntun'+(r.streak>=3?' · bonus +'+Math.min(r.streak-1,5)*50:'')+'</div>':'')+
  '<div class="peringkat"><div class="rk"><div class="nmr">#'+r.rank+'</div><div><small>Peringkatmu dari '+r.total+' pemain</small><b id="sk2">'+fmt(lama)+'</b> poin'+(naik>0?'<div class="gerak up">▲ naik '+naik+' peringkat!</div>':naik<0?'<div class="gerak dn">▼ turun '+(-naik)+' peringkat, kejar lagi!</div>':'')+'</div></div>'+
  '<div class="top3">'+(r.atas||[]).map(function(x,i){var aku=x.nama===me.nama;return'<div>'+(["🥇","🥈","🥉"][i])+' '+(i===0&&!aku&&idx<urut.length-1?'<span>??? '+e(x.av)+'</span><em>🔒 rahasia</em>':'<span>'+e(x.av+" "+x.nama)+(aku?" (kamu)":"")+'</span><em>'+fmt(x.skor)+'</em>')+'</div>'}).join("")+'</div>'+
  (r.rank>1&&idx<urut.length-1?'<p style="margin-top:12px;font-weight:700;opacity:.85">Siapa di puncak? Terungkap di akhir permainan 👀</p>':'')+
  '</div><button class="btn ung" id="lj" style="margin-top:18px">'+(idx+1<urut.length?"SOAL BERIKUTNYA →":"LIHAT HASIL AKHIR 🏁")+'</button></div>';
  var el=$("sk2"),a=lama,b=skor,t0=performance.now();(function anim(){var f=Math.min(1,(performance.now()-t0)/900);el.textContent=fmt(a+(b-a)*(1-Math.pow(1-f,3)));if(f<1)requestAnimationFrame(anim)})();
  var lanjut=function(){clearTimeout(ot);idx++;main()},ot=setTimeout(lanjut,6000);$("lj").onclick=lanjut}

/* ================= AKHIR + PODIUM ================= */
var akhirTm=0;
function akhir(){clearTimeout(akhirTm);app.innerHTML=kepala()+'<div class="pusat"><div class="logo">🏁</div><h2 class="judul" style="font-size:30px;margin-top:16px">Permainan Selesai!</h2><p style="opacity:.85;margin-top:6px">'+(Object.keys(jawab).length?Object.keys(jawab).filter(function(k){return jawab[k].b}).length+" dari "+urut.length+" benar · ":"")+fmt(skor)+' poin</p><div class="drum" id="dr">🥁 Menghitung peringkat…</div><div id="pd" style="width:100%"></div></div>';
  bunyi("go");setTimeout(function(){tarik(true)},1800)}
function podiumHtml(L){var t=[L[1],L[0],L[2]],c=["p2","p1","p3"];return'<div class="podium">'+t.map(function(x,i){if(!x)return'<div class="pd '+c[i]+'"></div>';return'<div class="pd '+c[i]+'" data-u="'+(c[i]==="p1"?3:c[i]==="p2"?2:1)+'">'+(c[i]==="p1"?'<div class="mahkota">👑</div>':'')+'<div class="av">'+e(x.av||"🙂")+'</div><div class="nm">'+e(x.nama)+'</div><div class="sk">'+fmt(x.skor)+'</div><div class="tg">'+(c[i]==="p1"?1:c[i]==="p2"?2:3)+'</div></div>'}).join("")+'</div>'}
function ungkap(wrap){var urutan=[1,2,3];urutan.forEach(function(u,i){setTimeout(function(){var el=wrap.querySelector('[data-u="'+u+'"]');if(el){el.classList.add("on");bunyi(u===3?"tada":"tik");if(u===3)konfeti(220)}},600+i*1300)})}
var sudahUngkap=false;
function tarik(awal){get({aksi:"kuisPapan",k:KID}).then(function(r){if(!r.ok)throw 0;var L=r.papan||[],ri=L.findIndex(function(x){return x.pid===me.pid}),blm=L.filter(function(x){return!x.selesai}).length,pd=$("pd"),dr=$("dr");if(!pd)return;
    dr.innerHTML=ri>=0?'Peringkatmu: <b style="color:var(--emas);font-size:34px">#'+(ri+1)+'</b> dari '+L.length+(blm?'<div style="font-size:14px;opacity:.8;margin-top:4px;font-family:Plus Jakarta Sans">⏳ '+blm+' teman masih bermain · papan diperbarui otomatis</div>':''):"";
    var h=podiumHtml(L)+'<div class="lst">'+L.slice(0,30).map(function(x,i){return'<div class="'+(x.pid===me.pid?"aku":"")+'"><span class="n">'+(i+1)+'</span><span>'+e((x.av||"")+" "+x.nama)+'</span><em>'+fmt(x.skor)+'</em></div>'}).join("")+'</div>';
    var tanda=JSON.stringify(L.slice(0,3).map(function(x){return x.pid+x.skor}));if(pd.dataset.t!==tanda||!sudahUngkap){pd.innerHTML=h;pd.dataset.t=tanda;if(!sudahUngkap){sudahUngkap=true;ungkap(pd)}else[].forEach.call(pd.querySelectorAll(".pd"),function(x){x.classList.add("on")})}
    else pd.querySelector(".lst").outerHTML='<div class="lst">'+L.slice(0,30).map(function(x,i){return'<div class="'+(x.pid===me.pid?"aku":"")+'"><span class="n">'+(i+1)+'</span><span>'+e((x.av||"")+" "+x.nama)+'</span><em>'+fmt(x.skor)+'</em></div>'}).join("")+'</div>';
    if(blm)akhirTm=setTimeout(function(){tarik(false)},5000)}).catch(function(){akhirTm=setTimeout(function(){tarik(false)},6000)})}

/* ================= PAPAN SKOR (LAYAR KELAS) ================= */
var posLama={};
function papan(){document.body.classList.add("papan");var link=location.href.replace(/[?&]papan=1/,"");
  app.innerHTML='<div class="pp-h"><div><span class="chip">🎮 Papan Skor Langsung</span><h1 style="margin-top:8px">'+e(K.judul)+'</h1></div><div class="pp-st"><div><b id="pn">0</b><small>Pemain</small></div><div><b id="pm">0</b><small>Bermain</small></div><div><b id="ps">0</b><small>Selesai</small></div></div></div>'+
  '<div class="pp-link">Gabung lewat: <b>'+e(link)+'</b></div><div style="display:flex;gap:10px;margin-top:12px"><button class="btn ung" id="pod" style="margin:0;font-size:17px;padding:13px">🏆 Tampilkan Podium</button><button class="btn" id="snd" style="margin:0;font-size:17px;padding:13px;max-width:120px">'+(suara?"🔊":"🔇")+'</button></div>'+
  '<div class="pp-l" id="pl"><div class="kosong">Menunggu pemain masuk arena… 👀</div></div>';
  $("snd").onclick=function(){suara=!suara;this.textContent=suara?"🔊":"🔇"};
  $("pod").onclick=function(){tutupPod();var L=window.__L||[];var o=document.createElement("div");o.id="ov";o.style.cssText="position:fixed;inset:0;z-index:40;background:rgba(10,4,40,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px";
    o.innerHTML='<h2 class="judul" style="font-size:40px">🏆 Juara '+e(K.judul)+'</h2><div class="drum">🥁 Dan para juaranya adalah…</div><div id="pw" style="width:100%;max-width:700px">'+podiumHtml(L)+'</div><button class="btn ung" style="max-width:260px" id="tp">Tutup</button>';document.body.appendChild(o);
    $("tp").onclick=tutupPod;ungkap($("pw"))};
  function tutupPod(){var o=$("ov");if(o)o.remove()}
  var tarikP=function(){get({aksi:"kuisPapan",k:KID}).then(function(r){if(r.ok)gambar(r.papan||[])}).catch(function(){}).then(function(){setTimeout(tarikP,3000)})};tarikP()}
function gambar(L){window.__L=L;var pl=$("pl");if(!pl)return;$("pn").textContent=L.length;$("pm").textContent=L.filter(function(x){return!x.selesai}).length;$("ps").textContent=L.filter(function(x){return x.selesai}).length;
  if(!L.length){pl.innerHTML='<div class="kosong">Menunggu pemain masuk arena… 👀</div>';pl.style.height="";return}
  var mx=Math.max(1,L[0].skor),H=70,ada={};[].forEach.call(pl.querySelectorAll(".pp-r"),function(r){ada[r.dataset.p]=r});var k=pl.querySelector(".kosong");if(k)k.remove();
  pl.style.height=(Math.min(L.length,40)*H)+"px";
  L.slice(0,40).forEach(function(x,i){var r=ada[x.pid];if(!r){r=document.createElement("div");r.className="pp-r";r.dataset.p=x.pid;r.style.transform="translateY("+(i*H+30)+"px)";r.style.opacity="0";pl.appendChild(r);requestAnimationFrame(function(){r.style.opacity="1"})}delete ada[x.pid];
    var lama=posLama[x.pid];if(lama!=null&&i<lama){r.classList.remove("naik");void r.offsetWidth;r.classList.add("naik");if(i===0)bunyi("ok")}posLama[x.pid]=i;
    r.className="pp-r"+(i<3?" r"+(i+1):"")+(r.classList.contains("naik")?" naik":"");
    r.innerHTML='<div class="bar" style="width:'+(x.skor/mx*100)+'%"></div><span class="n">'+(["🥇","🥈","🥉"][i]||(i+1))+'</span><span class="av">'+e(x.av||"🙂")+'</span><span class="nm">'+e(x.nama)+(x.kelas?'<small>'+e(x.kelas)+'</small>':'')+'</span>'+(x.streak>=3?'<span class="fl">🔥'+x.streak+'</span>':'')+'<span style="font-size:13px;font-weight:700;opacity:.8">'+(x.selesai?"✅":x.dijawab+"/"+K.soal.length)+'</span><span class="sk">'+fmt(x.skor)+'</span>';
    r.style.transform="translateY("+(i*H)+"px)"});
  Object.keys(ada).forEach(function(p){ada[p].remove()})}

/* ================= MULAI ================= */
get({aksi:"kuis",k:KID}).then(function(r){if(!r.ok)throw new Error(r.pesan||"Kuis tidak ditemukan");K=r.kuis;document.title=K.judul+" · Arena Kuis";
  if(PAPAN){papan();return}if(!K.buka&&!ambil("ks_nama")){}lobi()}).catch(function(x){gagal(x.message||"Tidak dapat terhubung ke server. Periksa koneksi internet (K1).")});
})();
