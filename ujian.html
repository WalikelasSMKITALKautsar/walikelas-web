<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#EEF2F9;color:#0F1B33;min-height:100vh}
.w{max-width:600px;margin:0 auto;padding:20px 14px 40px}

.op span{flex:1;padding-top:4px;white-space:pre-wrap;word-break:break-word}
.op .og{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:6px;border:1px solid #E3E9F4;background:#fff}

.hc .avw{position:relative;width:190px;height:200px;margin:2px auto 0;z-index:2}.hc .avw svg{width:100%;height:100%;overflow:visible}
.hc h2{font-size:23px;font-weight:800;margin-top:2px;position:relative;z-index:2;animation:hcMuncul .6s .2s both}

.hc .rw{background:#fff;color:#0F1B33;border-radius:18px;margin-top:14px;padding:4px 14px;text-align:left;position:relative;z-index:2}
.hc .rw div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #E3E9F4;font-size:13px}.hc .rw div:last-child{border:0}.hc .rw span{color:#55617A}.hc .rw b{text-align:right}
.hc .lc{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px}.hc .lc.ok{background:#EBFBEE;color:#2B8A3E}.hc .lc.no{background:#FFF0F0;color:#E03131}.hc .lc.wr{background:#FFF4E6;color:#C25E00}
.hc .kf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;z-index:1;animation:hcJatuh linear infinite;opacity:.95}
.hc .bl{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);z-index:0}
.hc-ak{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.hc-ak .btn{margin:0;font-size:14px}
.av-bd{animation:var(--gerak,avAyun) var(--dur,2.4s) ease-in-out infinite;transform-origin:100px 205px}
.av-mt{animation:avKedip 4s infinite;transform-origin:center 66px;transform-box:fill-box}
.av-ka{animation:var(--tk,none) 1s ease-in-out infinite;transform-origin:132px 122px}.av-ki{animation:var(--tki,none) 1.2s ease-in-out infinite;transform-origin:68px 122px}
.av-bt{animation:avKelip 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.av-bt:nth-of-type(2){animation-delay:.5s}.av-bt:nth-of-type(3){animation-delay:1s}
@keyframes avLompat{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.02,.98)}50%{transform:translateY(-26px)}75%{transform:translateY(0) scale(1.04,.95)}}
@keyframes avAngguk{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes avAyun{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes avTeguh{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}60%{transform:translateY(-5px) rotate(-1.5deg)}}
@keyframes avLambai{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes avAngkat{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes avKepal{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes avKedip{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes avKelip{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
@keyframes hcJatuh{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(760px) rotate(540deg)}}
@keyframes hcPop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes hcMuncul{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hc *,.hc{animation:none!important}}
/* ===== tampilan awal ujian ===== */
.hd{background:linear-gradient(125deg,#0C2257,#16388A 35%,#2F5DA8 65%,#0C8599);background-size:240% 240%;animation:hdGeser 12s ease-in-out infinite}
@keyframes hdGeser{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hd-ik{position:absolute;inset:0;pointer-events:none;overflow:hidden}.hd-ik i{position:absolute;bottom:-30px;font-style:normal;opacity:.28;animation:hdNaik linear infinite}
@keyframes hdNaik{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-260px) rotate(200deg);opacity:0}}
.hd>*{position:relative;z-index:1}
.inf span.ti{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;min-width:74px;animation:tiMuncul .5s both}.inf span.ti b{font-size:20px;line-height:1.1}.inf span.ti small{font-size:11px;font-weight:700;opacity:.85}
@keyframes tiMuncul{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
.sapa{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#E7F5FF,#E6FCF5);border-radius:18px;padding:10px 14px 10px 6px;margin-bottom:6px}
.sapa .av{width:78px;height:84px;flex:none}.sapa .av svg{width:100%;height:100%;overflow:visible}.sapa b{display:block;font-size:16px;line-height:1.3}.sapa span{display:block;font-size:12.5px;color:#55617A;line-height:1.45;margin-top:3px}
.sapa.hore .av{animation:avHore .7s}@keyframes avHore{0%,100%{transform:none}40%{transform:translateY(-10px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
.lgk{display:flex;gap:6px;margin:14px 0 2px}.lgk span{flex:1;text-align:center;font-size:11.5px;font-weight:800;color:#8A94A8;background:#F1F4FA;border-radius:99px;padding:7px 4px;transition:.3s}.lgk span.on{background:#16388A;color:#fff}.lgk span.ok{background:#D3F9D8;color:#2B8A3E}
.atr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.atr div{background:#F7F9FD;border:1.5px solid #E3E9F4;border-radius:16px;padding:11px 12px;animation:tiMuncul .5s both}.atr .ik{font-size:22px}.atr b{display:block;font-size:13px;margin-top:4px;line-height:1.3}.atr small{display:block;font-size:11.5px;color:#55617A;line-height:1.4;margin-top:3px}
.atr .bhy{background:#FFF5F5;border-color:#FFC9C9}.atr .bhy b{color:#C92A2A}
.btn.go{position:relative;overflow:hidden;font-size:16.5px;padding:17px;box-shadow:0 12px 24px -12px #16388A}.btn.go:not(:disabled):after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:kilap 2.4s infinite}
@keyframes kilap{0%{left:-60%}60%,100%{left:130%}}
.hit{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#2F5DA8,#0C2257 70%);color:#fff;text-align:center}
.hit b{font-size:120px;font-weight:800;line-height:1;display:block;animation:hitPop .9s both}.hit p{font-size:15px;font-weight:700;opacity:.9;margin-top:14px}
@keyframes hitPop{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.6);opacity:0}}
/* ===== peringatan keluar tab ===== */
.ov .wr.gt{animation:getar .5s 2}@keyframes getar{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-6deg)}40%{transform:translateX(8px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pot{display:inline-block;background:#E03131;color:#fff;font-size:30px;font-weight:800;border-radius:16px;padding:6px 18px;margin:4px 0 6px;animation:hitPop2 .6s both}@keyframes hitPop2{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.ksp{display:flex;gap:6px;justify-content:center;margin-top:12px}.ksp i{width:26px;height:10px;border-radius:6px;background:#D3F9D8}.ksp i.hb{background:#E03131}
.ov .sisa{font-size:12.5px;font-weight:700;color:#55617A;margin-top:6px}
</style>

<body>
<div class="w" id="awal">
  <div class="hd"><span class="bdg">Ujian Online</span><h1 id="jd">Memuat ujian…</h1><p id="ds"></p><div class="inf" id="inf"></div></div>

</div>
<div id="uj">

  <div class="nav"><button id="pv" type="button">‹ Sebelumnya</button><button class="ds" id="ds2" type="button">Daftar</button><button class="nx" id="nx" type="button">Berikutnya ›</button></div>
</div>
<div class="ov" id="ov"><div id="ovb"></div></div>
<script>
(function(){
  /* Kode deployment Apps Script. Biasanya terisi otomatis dari link (?s=...). */
  var KODE_DEPLOYMENT="";
  var q=new URLSearchParams(location.search),s=(q.get("s")||KODE_DEPLOYMENT).trim(),U=(q.get("u")||"").trim();
  var API=/^https:\/\//.test(s)?s.split("?")[0]:"https://script.google.com/macros/s/"+s+"/exec";
  var G=function(i){return document.getElementById(i)},isi=G("isi"),D=null,P=null,SO=[],jawab={},ragu={},cur=0,keluar=0,akhir=0,tik=0,selesai=false,jalan=false,pergi=false,kotor=false,LK="uj2_"+U;
  function e(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function simpan(){try{localStorage.setItem(LK,JSON.stringify({p:P,j:jawab,r:ragu,k:keluar,c:cur}))}catch(x){}}
  function muatLokal(){try{return JSON.parse(localStorage.getItem(LK)||"null")}catch(x){return null}}
  function kirim(b){return fetch(API,{method:"POST",body:JSON.stringify(b)}).then(function(r){return r.json()})}
  function gagal(m){G("jd").textContent="Ujian belum bisa dibuka";isi.innerHTML='<div class="ok"><p>'+e(m)+'</p></div>'}
  function imgUrl(x){var m=String(x||"").match(/\/d\/([A-Za-z0-9_-]{20,})/)||String(x||"").match(/[?&]id=([A-Za-z0-9_-]{20,})/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600":x}
  function tutupOv(){G("ov").className="ov"}
  function ov(h){G("ovb").innerHTML=h;G("ov").className="ov show"}
  /* pengacak tetap per siswa */
  function rng(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
  function acak(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function siapkan(){var r=rng(U+"|"+P.sid),L=D.soal.map(function(x){var ops=x.t==="pg"?x.o.map(function(t,i){var g="";t=String(t==null?"":t).replace(/\n?\[\[gambar:(https:\/\/[^\]\s]+)\]\]/,function(m,u){g=u;return""});return{k:"ABCDE".charAt(i),t:t,g:g}}):[];return{id:x.id,t:x.t,q:x.q,p:x.p,img:x.img,o:D.acakOpsi?acak(ops,r):ops}});
    if(D.acakSoal){var pg=L.filter(function(x){return x.t==="pg"}),ur=L.filter(function(x){return x.t==="ur"});L=acak(pg,r).concat(acak(ur,r))}SO=L}
  if(!s||!U){gagal("Link ujian tidak lengkap. Minta link terbaru kepada guru.");return}
